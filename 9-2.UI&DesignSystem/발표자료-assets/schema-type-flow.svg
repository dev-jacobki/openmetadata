<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="JSON Schema에서 생성 타입과 서비스 설정 UI까지의 연결 흐름">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:29px;font-weight:700;fill:#0f172a}
      .eyebrow{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2563eb;letter-spacing:.5px}
      .head{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:23px;font-weight:700;fill:#0f172a}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;fill:#475569}
      .mono{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#334155}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:16px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="56" y="54" class="eyebrow">스키마에서 UI까지</text>
  <text x="56" y="94" class="title">Schema는 계약을 만들고, UI는 그 계약을 타입과 화면 동작으로 연결한다.</text>
  <path d="M56 118 H1144" stroke="#bfdbfe" stroke-width="2"/>

  <path d="M273 276 H370 M570 276 H667 M867 276 H964" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="56" y="184" width="217" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="88" cy="215" r="16" fill="#2563eb"/><text x="82" y="222" font-family="Arial" font-size="17" font-weight="700" fill="#fff">1</text>
  <text x="84" y="262" class="head">JSON Schema</text>
  <text x="84" y="294" class="body">필드 · 타입 · 필수값</text>
  <text x="84" y="322" class="mono">source_type</text>
  <text x="84" y="348" class="note">openmetadata-spec</text>

  <rect x="370" y="184" width="200" height="184" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="402" cy="215" r="16" fill="#2563eb"/><text x="396" y="222" font-family="Arial" font-size="17" font-weight="700" fill="#fff">2</text>
  <text x="398" y="262" class="head">json2ts.sh</text>
  <text x="398" y="294" class="body">상대 경로 계산</text>
  <text x="398" y="322" class="mono">quicktype --just-types</text>
  <text x="398" y="348" class="note">생성 작업</text>

  <rect x="667" y="184" width="200" height="184" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="699" cy="215" r="16" fill="#2563eb"/><text x="693" y="222" font-family="Arial" font-size="17" font-weight="700" fill="#fff">3</text>
  <text x="695" y="262" class="head">생성 타입</text>
  <text x="695" y="294" class="mono">src/generated/</text>
  <text x="695" y="322" class="body">API · props · 설정값</text>
  <text x="695" y="348" class="note">자동 생성 범위</text>

  <rect x="964" y="184" width="180" height="184" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="996" cy="215" r="16" fill="#2563eb"/><text x="990" y="222" font-family="Arial" font-size="17" font-weight="700" fill="#fff">4</text>
  <text x="992" y="262" class="head">서비스 UI</text>
  <text x="992" y="294" class="body">Form 구성</text>
  <text x="992" y="322" class="body">요청 본문 연결</text>
  <text x="992" y="348" class="note">UI 코드 범위</text>

  <rect x="56" y="426" width="1088" height="86" rx="14" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="84" y="462" class="eyebrow">확인 포인트</text>
  <text x="84" y="492" class="body">새 연결 유형은 Schema만 추가해서 끝나지 않는다. 생성 타입을 갱신한 뒤, 선택된 source_type에 맞는 Form·선택지·요청 데이터를 UI에서 연결한다.</text>
</svg>
