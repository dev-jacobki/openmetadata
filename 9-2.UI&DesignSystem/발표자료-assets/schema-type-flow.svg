  <text x="216" y="305" class="m">source_type</text>
  <path d="M216 346 H350" stroke="#11253d" stroke-width="2"/>
  <text x="216" y="376" class="s">openmetadata-spec</text>

  <text x="392" y="208" class="k">타입 생성</text>
  <text x="392" y="246" class="h">02 · json2ts.sh</text>
  <text x="392" y="277" class="b">상대 경로 유지</text>
  <text x="392" y="305" class="m">quicktype --just-types</text>
  <path d="M392 346 H538" stroke="#11253d" stroke-width="2"/>
