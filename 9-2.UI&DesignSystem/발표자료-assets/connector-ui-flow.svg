<svg xmlns="http://www.w3.org/2000/svg" width="920" height="690" viewBox="0 0 920 690" role="img" aria-labelledby="title desc">
  <title id="title">Service 선택부터 Form·안내 문서까지의 흐름</title>
  <desc id="desc">Service Category와 Type이 Connection Schema를 선택하고, RJSF가 Form을 만들면 AJV가 입력값을 검증한다. focus한 field ID와 Markdown section ID를 연결해 해당 설명으로 이동한다.</desc>
  <defs>
    <filter id="shadow" x="-8%" y="-12%" width="116%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#263A5A" flood-opacity=".10"/></filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;fill:#172B4D}
      .sub{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#5B6B80}
      .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:14px;font-weight:700;fill:#356AAE;letter-spacing:.3px}
      .heading{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:21px;font-weight:700;fill:#172B4D}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#40536E}
      .small{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:500;fill:#62748B}
      .mono{font-family:Menlo,Consolas,monospace;font-size:14px;font-weight:600;fill:#40536E}
      .flow{stroke:#5E789A;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="920" height="690" fill="#FFFFFF"/>
  <text class="title" x="32" y="46">Service 선택부터 Form·안내 문서까지의 흐름</text>
  <text class="sub" x="32" y="75">Category·Type이 Form을 결정하고, focus된 field ID가 우측 문서 section을 찾는다.</text>

  <g filter="url(#shadow)"><rect x="300" y="106" width="560" height="78" rx="15" fill="#EEF6FF" stroke="#B7D2F6" stroke-width="2"/></g>
  <text class="label" x="326" y="135">SERVICE 선택</text>
  <text class="heading" x="326" y="165">Database · MySQL</text>
  <text class="mono" x="650" y="165">category + type</text>

  <path class="flow" d="M580 184 V203"/>
  <path d="M580 214 L573 202 H587 Z" fill="#5E789A"/>
  <text class="small" x="598" y="203">선택값</text>

  <g filter="url(#shadow)"><rect x="300" y="218" width="560" height="78" rx="15" fill="#F7F3FF" stroke="#D8CDF6" stroke-width="2"/></g>
  <text class="label" x="326" y="247">CATEGORY / TYPE 매핑</text>
  <text class="heading" x="326" y="277">계열 유틸리티 → 제품 Schema</text>
  <text class="small" x="704" y="277">TypeScript switch/case</text>

  <path class="flow" d="M580 296 V315"/>
  <path d="M580 326 L573 314 H587 Z" fill="#5E789A"/>
  <text class="small" x="598" y="315">매핑 결과</text>

  <g filter="url(#shadow)"><rect x="300" y="330" width="560" height="78" rx="15" fill="#FFF8EC" stroke="#F0D3A1" stroke-width="2"/></g>
  <text class="label" x="326" y="359">CONNECTION SCHEMA</text>
  <text class="heading" x="326" y="389">mysqlConnection</text>
  <text class="mono" x="650" y="389">schema + uiSchema</text>

  <path class="flow" d="M580 408 V427"/>
  <path d="M580 438 L573 426 H587 Z" fill="#5E789A"/>
  <text class="small" x="598" y="427">Form에 전달</text>

  <g filter="url(#shadow)"><rect x="300" y="442" width="560" height="78" rx="15" fill="#EFFAF5" stroke="#B8E1CC" stroke-width="2"/></g>
  <text class="label" x="326" y="471">CONNECTION CONFIG FORM</text>
  <text class="heading" x="326" y="501">RJSF가 입력 Form 생성</text>
  <text class="small" x="610" y="501">AJV가 Schema 규칙 검증</text>

  <path class="flow" d="M580 520 V573"/>
  <path d="M580 584 L573 572 H587 Z" fill="#5E789A"/>
  <text class="small" x="598" y="554">focus한 field ID 전달</text>
  <text class="mono" x="598" y="576">username</text>

  <g filter="url(#shadow)"><rect x="300" y="588" width="560" height="78" rx="15" fill="#FFF6F4" stroke="#EDC7BF" stroke-width="2"/></g>
  <text class="label" x="326" y="617">SERVICE DOC PANEL</text>
  <text class="heading" x="326" y="647">같은 ID의 설명으로 이동·강조</text>

  <g filter="url(#shadow)"><rect x="30" y="588" width="230" height="78" rx="15" fill="#F9FBFD" stroke="#C9D8E8" stroke-width="2"/></g>
  <text class="label" x="52" y="617">LOCALE MARKDOWN</text>
  <text class="body" x="52" y="647">Mysql.md · id="username"</text>
  <path class="flow" d="M260 627 H284"/>
  <path d="M296 627 L284 620 V634 Z" fill="#5E789A"/>
</svg>
