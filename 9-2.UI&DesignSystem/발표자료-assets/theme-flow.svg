<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Theme 설정값은 두 UI Provider로 전파된다</title>
  <desc id="desc">Settings의 Theme 설정은 application configuration에서 palette로 구성되고 AntDConfigProvider와 createMuiTheme에 전달된다.</desc>
  <defs>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:38px;font-weight:700;fill:#213959}.route{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#62738B}.cardTitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#213959}.body{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#435875}.mono{font-family:Menlo,Consolas,monospace;font-size:17px;font-weight:500;fill:#314660}.label{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2E6DD8}.line{stroke:#485B78;stroke-width:3;fill:none}.rule{stroke:#B5C4D6;stroke-width:2}.setting{fill:#FFFFFF;stroke:#2E6DD8;stroke-width:3}.config{fill:#EEF5FF;stroke:#2E6DD8;stroke-width:3}.antd{fill:#FFF8F0;stroke:#C66A16;stroke-width:3}.mui{fill:#EFFAF4;stroke:#27875F;stroke-width:3}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text class="title" x="40" y="66">Theme 설정값은 두 UI Provider로 전파된다</text>
  <text class="route" x="40" y="104">UI: Settings &gt; Preferences &gt; Theme</text>

  <rect class="setting" x="70" y="255" width="260" height="155" rx="17"/>
  <text class="cardTitle" x="98" y="300">Theme 설정</text>
  <path class="rule" d="M98 322 H302"/>
  <text class="mono" x="98" y="358">customLogoConfig</text>
  <text class="mono" x="98" y="387">customTheme</text>

  <path class="line" d="M330 332 H417"/>
  <polygon points="430,332 417,325 417,339" fill="#485B78"/>
  <text class="label" x="380" y="298" text-anchor="middle">저장</text>

  <rect class="config" x="440" y="235" width="330" height="195" rx="17"/>
  <text class="cardTitle" x="470" y="282">application configuration</text>
  <path class="rule" d="M470 307 H740"/>
  <text class="mono" x="470" y="347">getThemeConfig()</text>
  <text class="body" x="470" y="385">palette 구성</text>

  <path class="line" d="M770 332 H865 V225 H917"/>
  <polygon points="930,225 917,218 917,232" fill="#485B78"/>
  <path class="line" d="M865 332 V485 H917"/>
  <polygon points="930,485 917,478 917,492" fill="#485B78"/>
  <text class="label" x="840" y="303" text-anchor="middle">적용</text>

  <rect class="antd" x="940" y="155" width="265" height="140" rx="17"/>
  <text class="cardTitle" x="968" y="205">AntDConfigProvider</text>
  <text class="body" x="968" y="247">token · primaryColor</text>

  <rect class="mui" x="940" y="415" width="265" height="140" rx="17"/>
  <text class="cardTitle" x="968" y="465">createMuiTheme</text>
  <text class="body" x="968" y="507">공유 UI / MUI</text>
</svg>
