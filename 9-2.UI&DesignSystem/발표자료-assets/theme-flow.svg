<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">설정값이 화면에 도달하는 경로</title>
  <desc id="desc">Theme 설정의 customTheme은 AppRoot와 applicationConfig를 거쳐 Ant Design, MUI, Untitled UI에 반영된다. customLogoConfig는 logo와 favicon에 별도로 적용된다.</desc>
  <defs>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
  </defs>
  <style>
    .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172B4D}
    .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#5F6F86}
    .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#4267A5}
    .cardTitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#172B4D}
    .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#40536E}
    .mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:500;fill:#40536E}
    .arrow{stroke:#52709A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
    .divider{stroke:#CBD8EA;stroke-width:1.5}
  </style>

  <rect width="1280" height="560" fill="#FFFFFF"/>
  <text class="title" x="40" y="54">설정값이 화면에 도달하는 경로</text>
  <text class="subtitle" x="40" y="86">테마 색상은 세 UI 체계에 전달되고, 브랜드 이미지는 별도 경로로 적용된다.</text>

  <rect x="40" y="155" width="270" height="300" rx="22" fill="#EAF3FF" stroke="#9FC2F2" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="68" y="195">관리자 설정</text>
  <text class="cardTitle" x="68" y="232">Theme 설정</text>
  <line class="divider" x1="68" y1="255" x2="282" y2="255"/>
  <text class="mono" x="68" y="296">customTheme</text>
  <text class="body" x="68" y="324">색상 · 상태 색상</text>
  <text class="mono" x="68" y="374">customLogoConfig</text>
  <text class="body" x="68" y="402">logo · favicon</text>

  <path class="arrow" d="M310 305 H364"/>
  <polygon points="378,305 364,297 364,313" fill="#52709A"/>
  <rect x="378" y="155" width="285" height="300" rx="22" fill="#F2EDFF" stroke="#C9B9F1" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="406" y="195" fill="#7357B7">앱 초기화</text>
  <text class="cardTitle" x="406" y="232">AppRoot</text>
  <line class="divider" x1="406" y1="255" x2="635" y2="255"/>
  <text class="mono" x="406" y="299">getThemeConfig()</text>
  <text class="body" x="406" y="329">비어 있는 기본값 보완</text>
  <text class="mono" x="406" y="379">applicationConfig</text>
  <text class="body" x="406" y="409">customTheme을 Provider로 전달</text>

  <path d="M663 305 H715 V183 H752" class="arrow"/>
  <polygon points="766,183 752,175 752,191" fill="#52709A"/>
  <path d="M715 305 H752" class="arrow"/>
  <polygon points="766,305 752,297 752,313" fill="#52709A"/>
  <path d="M715 305 V427 H752" class="arrow"/>
  <polygon points="766,427 752,419 752,435" fill="#52709A"/>

  <rect x="766" y="135" width="474" height="96" rx="19" fill="#FFF4E8" stroke="#EAC58F" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="794" y="169" fill="#A96519">ANT DESIGN</text>
  <text class="cardTitle" x="794" y="202">AntDConfigProvider</text>
  <text class="body" x="1040" y="202">palette · --ant-* 변수</text>

  <rect x="766" y="257" width="474" height="96" rx="19" fill="#EAF8F1" stroke="#A8D5BE" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="794" y="291" fill="#327C5D">MUI</text>
  <text class="cardTitle" x="794" y="324">ThemeProvider</text>
  <text class="body" x="1000" y="324">createMuiTheme()</text>

  <rect x="766" y="379" width="474" height="96" rx="19" fill="#F4EEFF" stroke="#C7B4ED" stroke-width="2" filter="url(#shadow)"/>
  <text class="label" x="794" y="413" fill="#7357B7">UNTITLED UI</text>
  <text class="cardTitle" x="794" y="446">UntitledUIThemeProvider</text>
  <text class="body" x="1080" y="446">brandColors · --tw-*</text>

  <path class="arrow" d="M175 455 V510 H365"/>
  <polygon points="379,510 365,502 365,518" fill="#52709A"/>
  <text class="mono" x="397" y="516">BrandImage</text>
  <text class="body" x="510" y="516">로고 · 모노그램</text>
  <text class="mono" x="735" y="516">AppRoot</text>
  <text class="body" x="818" y="516">파비콘</text>
</svg>
