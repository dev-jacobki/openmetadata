<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="540" viewBox="0 0 1280 540" role="img" aria-labelledby="title desc">
  <title id="title">설정값이 화면에 도달하는 경로</title>
  <desc id="desc">Settings의 customTheme이 application configuration을 거쳐 AntDConfigProvider와 createMuiTheme에 전달된다.</desc>
  <style>
    .title{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:37px;font-weight:700;fill:#213959}.subtitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#62738B}.cardTitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#213959}.body{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#435875}.mono{font-family:Menlo,Consolas,monospace;font-size:17px;font-weight:500;fill:#314660}.label{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2E6DD8}.line{stroke:#485B78;stroke-width:3;fill:none}.rule{stroke:#B5C4D6;stroke-width:2}.setting{fill:#FFFFFF;stroke:#2E6DD8;stroke-width:3}.config{fill:#EEF5FF;stroke:#2E6DD8;stroke-width:3}.antd{fill:#FFF8F0;stroke:#C66A16;stroke-width:3}.mui{fill:#EFFAF4;stroke:#27875F;stroke-width:3}
  </style>
  <rect width="1280" height="540" fill="#FFFFFF"/>
  <text class="title" x="40" y="58">설정값이 화면에 도달하는 경로</text>
  <text class="subtitle" x="40" y="96">Settings &gt; Preferences &gt; Theme의 customTheme이 두 UI Provider에 전달된다.</text>

  <rect class="setting" x="70" y="205" width="260" height="145" rx="17"/>
  <text class="cardTitle" x="98" y="250">Theme 설정</text>
  <path class="rule" d="M98 272 H302"/>
  <text class="mono" x="98" y="308">customLogoConfig</text>
  <text class="mono" x="98" y="337">customTheme</text>
  <path class="line" d="M330 277 H417"/><polygon points="430,277 417,270 417,284" fill="#485B78"/>
  <text class="label" x="380" y="243" text-anchor="middle">저장</text>

  <rect class="config" x="440" y="180" width="330" height="190" rx="17"/>
  <text class="cardTitle" x="470" y="227">application configuration</text>
  <path class="rule" d="M470 252 H740"/>
  <text class="mono" x="470" y="292">getThemeConfig()</text>
  <text class="body" x="470" y="330">palette 구성</text>

  <path class="line" d="M770 277 H865 V195 H917"/><polygon points="930,195 917,188 917,202" fill="#485B78"/>
  <path class="line" d="M865 277 V425 H917"/><polygon points="930,425 917,418 917,432" fill="#485B78"/>
  <text class="label" x="840" y="248" text-anchor="middle">적용</text>

  <rect class="antd" x="940" y="125" width="265" height="140" rx="17"/>
  <text class="cardTitle" x="968" y="175">AntDConfigProvider</text>
  <text class="body" x="968" y="217">token · primaryColor</text>
  <rect class="mui" x="940" y="355" width="265" height="140" rx="17"/>
  <text class="cardTitle" x="968" y="405">createMuiTheme</text>
  <text class="body" x="968" y="447">공유 UI / MUI</text>
</svg>
