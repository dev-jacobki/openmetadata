<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Theme 설정이 앱 Store와 여러 UI Provider로 전달되는 흐름">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:29px;font-weight:700;fill:#0f172a}
      .eyebrow{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2563eb;letter-spacing:.5px}
      .head{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:23px;font-weight:700;fill:#0f172a}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;fill:#475569}
      .mono{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#334155}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:16px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="56" y="54" class="eyebrow">UI 페이지 · SETTINGS &gt; PREFERENCES &gt; THEME</text>
  <text x="56" y="94" class="title">Theme 설정은 한 번 저장되고, 여러 Provider가 같은 값을 사용한다.</text>
  <path d="M56 118 H1144" stroke="#bfdbfe" stroke-width="2"/>

  <rect x="56" y="174" width="244" height="216" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="84" y="220" class="head">Theme 설정</text>
  <text x="84" y="255" class="mono">customTheme</text>
  <text x="84" y="285" class="body">primary · hover · selected</text>
  <text x="84" y="314" class="body">오류 · 성공 · 경고 · 정보</text>
  <text x="84" y="351" class="note">logo · monogram · favicon</text>

  <path d="M300 282 H423" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="438" y="174" width="286" height="216" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="466" y="220" class="head">AppRoot / Store</text>
  <text x="466" y="255" class="mono">applicationConfig</text>
  <text x="466" y="285" class="body">getThemeConfig()로 기본값 보완</text>
  <text x="466" y="314" class="body">customTheme을 전역 상태로 유지</text>
  <text x="466" y="351" class="note">앱 초기 로드 시 설정 조회</text>

  <path d="M724 245 H822 M724 322 H822" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="838" y="154" width="306" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="866" y="197" class="head">AntDConfigProvider</text>
  <text x="866" y="226" class="body">palette · CSS 변수 · Ant Design</text>
  <rect x="838" y="302" width="306" height="108" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="866" y="345" class="head">공유 UI / MUI</text>
  <text x="866" y="374" class="body">createMuiTheme · ThemeProvider</text>

  <rect x="56" y="454" width="1088" height="72" rx="14" fill="#0f172a"/>
  <circle cx="92" cy="490" r="13" fill="#2563eb"/><circle cx="126" cy="490" r="13" fill="#60a5fa"/><circle cx="160" cy="490" r="13" fill="#bfdbfe"/>
  <text x="196" y="497" font-family="'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif" font-size="18" fill="#e2e8f0">primaryColor 값이 비어 있으면 생성 팔레트의 단계값을 hover·selected 기본값으로 사용한다.</text>
</svg>
