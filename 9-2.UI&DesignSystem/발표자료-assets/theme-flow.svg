<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">설정값이 화면에 도달하는 경로</title>
  <desc id="desc">Theme 설정은 AppRoot의 applicationConfig에 저장된다. customTheme은 세 UI 계층에, customLogoConfig는 BrandImage와 favicon에 적용된다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#27405F" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172B4D}
      .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#5F6F86}
      .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#4267A5}
      .cardTitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#172B4D}
      .mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#40536E}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#40536E}
      .arrow{stroke:#52709A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .divider{stroke:#CBD8EA;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1280" height="470" fill="#FFFFFF"/>
  <text class="title" x="40" y="54">설정값이 화면에 도달하는 경로</text>
  <text class="subtitle" x="40" y="86">하나의 Preference를 읽은 뒤, 색상과 브랜드 자산은 서로 다른 적용 경로로 전달된다.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="145" width="260" height="260" rx="22" fill="#EAF3FF" stroke="#9FC2F2" stroke-width="2"/>
  </g>
  <text class="label" x="68" y="180">관리자 설정</text>
  <text class="cardTitle" x="68" y="216">Theme 설정</text>
  <line class="divider" x1="68" y1="236" x2="272" y2="236"/>
  <text class="mono" x="68" y="278">customTheme</text>
  <text class="body" x="68" y="306">색상 · 상태 색상</text>
  <text class="mono" x="68" y="354">customLogoConfig</text>
  <text class="body" x="68" y="382">logo · monogram · favicon</text>

  <path class="arrow" d="M300 270 H341"/>
  <polygon points="355,270 341,262 341,278" fill="#52709A"/>
  <text class="label" x="328" y="245" text-anchor="middle">설정 로드</text>

  <g filter="url(#shadow)">
    <rect x="355" y="145" width="270" height="260" rx="22" fill="#F2EDFF" stroke="#C9B9F1" stroke-width="2"/>
  </g>
  <text class="label" x="383" y="180" fill="#7357B7">앱 초기화</text>
  <text class="cardTitle" x="383" y="216">AppRoot</text>
  <line class="divider" x1="383" y1="236" x2="597" y2="236"/>
  <text class="mono" x="383" y="278">customTheme</text>
  <text class="body" x="383" y="306">getThemeConfig()로 기본값 보완</text>
  <text class="mono" x="383" y="354">customLogoConfig</text>
  <text class="body" x="383" y="382">applicationConfig에 함께 보관</text>

  <path class="arrow" d="M625 270 H662 V224 H686"/>
  <polygon points="700,224 686,216 686,232" fill="#52709A"/>
  <path class="arrow" d="M625 354 H686"/>
  <polygon points="700,354 686,346 686,362" fill="#52709A"/>

  <g filter="url(#shadow)">
    <rect x="700" y="135" width="540" height="155" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text class="label" x="728" y="168" fill="#2563EB">customTheme 적용</text>
  <line class="divider" x1="728" y1="182" x2="1212" y2="182"/>
  <text class="mono" x="728" y="213">AntDConfigProvider</text>
  <text class="body" x="1020" y="213">palette · --ant-*</text>
  <text class="mono" x="728" y="246">MUI ThemeProvider</text>
  <text class="body" x="1020" y="246">createMuiTheme()</text>
  <text class="mono" x="728" y="274">UntitledUIThemeProvider</text>
  <text class="body" x="1050" y="274">brandColors · --tw-*</text>

  <g filter="url(#shadow)">
    <rect x="700" y="315" width="540" height="110" rx="20" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text class="label" x="728" y="348" fill="#7357B7">customLogoConfig 적용</text>
  <line class="divider" x1="728" y1="362" x2="1212" y2="362"/>
  <text class="mono" x="728" y="393">BrandImage</text>
  <text class="body" x="900" y="393">logo · monogram</text>
  <text class="mono" x="728" y="416">AppRoot</text>
  <text class="body" x="900" y="416">favicon</text>
</svg>
