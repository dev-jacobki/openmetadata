<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="680" viewBox="0 0 1280 680" role="img" aria-labelledby="title desc">
  <title id="title">설정값이 화면에 도달하는 경로</title>
  <desc id="desc">Theme 설정은 AppRoot의 applicationConfig를 거쳐 Ant Design, MUI, Untitled UI에 전달된다. customLogoConfig는 applicationConfig에서 BrandImage와 favicon으로 향한다.</desc>
  <defs>
    <filter id="shadow" x="-12%" y="-15%" width="124%" height="132%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#1E3A5F" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172B4D}
      .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#5F6F86}
      .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#4267A5}
      .cardTitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#172B4D}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#40536E}
      .mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#40536E}
      .arrow{stroke:#52709A;stroke-width:4;stroke-linecap:round;stroke-linejoin:round;fill:none}
      .divider{stroke:#CBD8EA;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1280" height="680" fill="#FFFFFF"/>
  <text class="title" x="40" y="54">설정값이 화면에 도달하는 경로</text>
  <text class="subtitle" x="40" y="86">색상은 세 UI 계층으로, 브랜드 자산은 applicationConfig에서 각 표시 위치로 전달된다.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="150" width="270" height="275" rx="22" fill="#EAF3FF" stroke="#9FC2F2" stroke-width="2"/>
  </g>
  <text class="label" x="68" y="190">관리자 설정</text>
  <text class="cardTitle" x="68" y="227">Theme 설정</text>
  <line class="divider" x1="68" y1="250" x2="282" y2="250"/>
  <text class="mono" x="68" y="292">customTheme</text>
  <text class="body" x="68" y="322">색상 · 상태 색상</text>
  <text class="mono" x="68" y="371">customLogoConfig</text>
  <text class="body" x="68" y="401">logo · monogram · favicon</text>

  <path class="arrow" d="M310 287 H350"/>
  <polygon points="364,287 350,279 350,295" fill="#52709A"/>
  <g filter="url(#shadow)">
    <rect x="364" y="150" width="290" height="275" rx="22" fill="#F2EDFF" stroke="#C9B9F1" stroke-width="2"/>
  </g>
  <text class="label" x="392" y="190" fill="#7357B7">앱 초기화</text>
  <text class="cardTitle" x="392" y="227">AppRoot</text>
  <line class="divider" x1="392" y1="250" x2="626" y2="250"/>
  <text class="mono" x="392" y="292">getThemeConfig()</text>
  <text class="body" x="392" y="322">누락된 색상 기본값 보완</text>
  <text class="mono" x="392" y="371">applicationConfig</text>
  <text class="body" x="392" y="401">Theme · logo 설정을 함께 보관</text>

  <path class="arrow" d="M654 287 H694 V168 H722"/>
  <polygon points="736,168 722,160 722,176" fill="#52709A"/>
  <path class="arrow" d="M694 287 H722"/>
  <polygon points="736,287 722,279 722,295" fill="#52709A"/>
  <path class="arrow" d="M694 287 V406 H722"/>
  <polygon points="736,406 722,398 722,414" fill="#52709A"/>

  <g filter="url(#shadow)">
    <rect x="736" y="120" width="504" height="96" rx="19" fill="#FFF4E8" stroke="#EAC58F" stroke-width="2"/>
  </g>
  <text class="label" x="764" y="154" fill="#A96519">ANT DESIGN</text>
  <text class="cardTitle" x="764" y="187">AntDConfigProvider</text>
  <text class="body" x="1040" y="187">palette · --ant-* 변수</text>

  <g filter="url(#shadow)">
    <rect x="736" y="239" width="504" height="96" rx="19" fill="#EAF8F1" stroke="#A8D5BE" stroke-width="2"/>
  </g>
  <text class="label" x="764" y="273" fill="#327C5D">MUI</text>
  <text class="cardTitle" x="764" y="306">ThemeProvider</text>
  <text class="body" x="1000" y="306">createMuiTheme()</text>

  <g filter="url(#shadow)">
    <rect x="736" y="358" width="504" height="96" rx="19" fill="#F4EEFF" stroke="#C7B4ED" stroke-width="2"/>
  </g>
  <text class="label" x="764" y="392" fill="#7357B7">UNTITLED UI</text>
  <text class="cardTitle" x="764" y="425">UntitledUIThemeProvider</text>
  <text class="body" x="1080" y="425">brandColors · --tw-*</text>

  <path class="arrow" d="M509 425 V505 H676"/>
  <polygon points="690,505 676,497 676,513" fill="#52709A"/>
  <path class="arrow" d="M509 425 V605 H676"/>
  <polygon points="690,605 676,597 676,613" fill="#52709A"/>
  <text class="label" x="548" y="486" fill="#7357B7">customLogoConfig</text>

  <g filter="url(#shadow)">
    <rect x="690" y="460" width="360" height="90" rx="19" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text class="mono" x="720" y="497">BrandImage</text>
  <text class="body" x="720" y="528">logo · monogram을 화면에 표시</text>

  <g filter="url(#shadow)">
    <rect x="690" y="560" width="360" height="90" rx="19" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2"/>
  </g>
  <text class="mono" x="720" y="597">AppRoot</text>
  <text class="body" x="720" y="628">favicon link를 브라우저에 적용</text>
</svg>
