<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="Theme 설정이 앱 상태와 여러 UI Provider에 전달되는 경로">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#c45732"/></marker>
    <style>
      .n{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#d5dbe3;font-size:84px;font-weight:700}
      .k{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#c45732;font-size:16px;font-weight:700;letter-spacing:1px}
      .t{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:29px;font-weight:700}
      .h{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:22px;font-weight:700}
      .b{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#4c5e70;font-size:18px}
      .m{font-family:Menlo,Consolas,monospace;fill:#334155;font-size:15px}
      .s{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#718096;font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fbfcfe"/>
  <rect x="56" y="56" width="7" height="488" fill="#c45732"/>
  <text x="84" y="104" class="n">03</text>
  <text x="216" y="83" class="k">UI 페이지 · SETTINGS &gt; PREFERENCES &gt; THEME</text>
  <text x="216" y="121" class="t">Theme 설정의 전역 반영 경로</text>
  <path d="M216 146 H1140" stroke="#d9e0e8" stroke-width="2"/>

  <text x="216" y="207" class="k">설정값</text>
  <text x="216" y="243" class="h">Theme 설정</text>
  <text x="216" y="275" class="m">customLogoConfig · customTheme</text>
  <text x="216" y="308" class="b">primary · hover · selected</text>
  <text x="216" y="340" class="b">error · success · warning · info</text>
  <text x="216" y="372" class="s">로고 · 모노그램 · favicon</text>
  <path d="M216 399 H460" stroke="#11253d" stroke-width="2"/>

  <path d="M496 300 H616" fill="none" stroke="#c45732" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="510" y="278" class="k">초기 로드</text>

  <text x="656" y="207" class="k">앱 상태</text>
  <text x="656" y="243" class="h">AppRoot / Store</text>
  <text x="656" y="275" class="m">applicationConfig</text>
  <text x="656" y="308" class="b">getThemeConfig()로 기본값 보완</text>
  <text x="656" y="340" class="b">customTheme을 전역 상태로 유지</text>
  <text x="656" y="372" class="s">이후 Provider가 같은 값을 구독</text>
  <path d="M656 399 H900" stroke="#11253d" stroke-width="2"/>

  <path d="M900 300 H954 V242 H1086 M954 300 V386 H1086" fill="none" stroke="#c45732" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="922" y="211" class="k">적용</text>
  <text x="972" y="242" class="h">AntDConfigProvider</text>
  <text x="972" y="271" class="b">palette · CSS 변수 · Ant Design</text>
  <text x="972" y="386" class="h">공유 UI / MUI</text>
  <text x="972" y="415" class="b">createMuiTheme · ThemeProvider</text>

  <path d="M216 472 H1140" stroke="#d9e0e8" stroke-width="2"/>
  <circle cx="232" cy="514" r="11" fill="#c45732"/><circle cx="262" cy="514" r="11" fill="#e6a079"/><circle cx="292" cy="514" r="11" fill="#f5d0bd"/>
  <text x="320" y="521" class="b">primaryColor 값이 비어 있으면 생성 팔레트의 단계값을 hover·selected 기본값으로 사용한다.</text>
</svg>
