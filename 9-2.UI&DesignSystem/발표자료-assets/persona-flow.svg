<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="455" viewBox="0 0 1280 455" role="img" aria-labelledby="title desc">
  <title id="title">Persona 선택이 화면 구성을 바꾸는 흐름</title>
  <desc id="desc">조직이 정의한 Persona를 User에 직접 또는 팀을 통해 연결하고, 사용자가 Persona를 선택하면 Frontend가 해당 Persona 문서를 다시 읽어 Navigation과 Landing Page를 갱신한다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#263A5A" flood-opacity=".10"/></filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172033}
      .sub{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#64748B}
      .tag{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;fill:#3469AB;letter-spacing:.35px}
      .card{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:22px;font-weight:700;fill:#172033}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#43546A}
      .small{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:500;fill:#62748B}
      .mono{font-family:Menlo,Consolas,monospace;font-size:15px;font-weight:600;fill:#40536E}
      .line{stroke:#61748E;stroke-width:3;fill:none;stroke-linecap:round}
      .rule{stroke:#D5DEE8;stroke-width:1.4}
    </style>
  </defs>
  <rect width="1280" height="455" fill="#fff"/>
  <text class="title" x="40" y="54">Persona 선택이 화면 구성을 바꾸는 흐름</text>
  <text class="sub" x="40" y="86">직무별 Persona를 User에 연결하고, 선택된 Persona 문서에서 Navigation과 Landing 구성을 다시 읽는다.</text>

  <g filter="url(#shadow)"><rect x="40" y="133" width="238" height="238" rx="18" fill="#EFF6FF" stroke="#B5D1F5" stroke-width="2"/></g>
  <text class="tag" x="64" y="166">1 · PERSONA 정의</text>
  <text class="card" x="64" y="204">업무 역할 단위</text>
  <line class="rule" x1="64" y1="222" x2="254" y2="222"/>
  <text class="body" x="64" y="257">Data Engineer</text>
  <text class="body" x="64" y="286">Data Steward</text>
  <text class="body" x="64" y="315">Data Scientist</text>
  <text class="small" x="64" y="345">권한(Role)이 아닌 UI 기준</text>

  <path class="line" d="M278 252 H312"/><path d="M328 252 L312 244 V260 Z" fill="#61748E"/>

  <g filter="url(#shadow)"><rect x="328" y="133" width="276" height="238" rx="18" fill="#F7F3FF" stroke="#D8CDF6" stroke-width="2"/></g>
  <text class="tag" x="352" y="166" fill="#7055B7">2 · USER 매핑</text>
  <text class="card" x="352" y="204">선택 후보를 만든다</text>
  <line class="rule" x1="352" y1="222" x2="580" y2="222"/>
  <text class="mono" x="352" y="255">personas</text>
  <text class="small" x="458" y="255">직접 할당</text>
  <text class="mono" x="352" y="286">inheritedPersonas</text>
  <text class="small" x="520" y="286">팀에서 상속</text>
  <text class="mono" x="352" y="324">defaultPersona</text>
  <text class="small" x="510" y="324">로그인 기본값</text>

  <path class="line" d="M604 252 H638"/><path d="M654 252 L638 244 V260 Z" fill="#61748E"/>

  <g filter="url(#shadow)"><rect x="654" y="133" width="226" height="238" rx="18" fill="#FFF8EC" stroke="#F0D3A1" stroke-width="2"/></g>
  <text class="tag" x="678" y="166" fill="#A66A1C">3 · 상단 사용자 메뉴</text>
  <text class="card" x="678" y="204">Persona 선택</text>
  <line class="rule" x1="678" y1="222" x2="856" y2="222"/>
  <text class="mono" x="678" y="260">selectedPersona</text>
  <text class="body" x="678" y="296">현재 선택값 변경</text>
  <text class="small" x="678" y="328">Role 권한은 변경하지 않음</text>

  <path class="line" d="M880 252 H914"/><path d="M930 252 L914 244 V260 Z" fill="#61748E"/>

  <g filter="url(#shadow)"><rect x="930" y="117" width="310" height="270" rx="18" fill="#EFFAF5" stroke="#B8E1CC" stroke-width="2"/></g>
  <text class="tag" x="956" y="151" fill="#27865F">4 · PERSONA 문서 조회</text>
  <text class="card" x="956" y="190">UI 자동 전환</text>
  <line class="rule" x1="956" y1="208" x2="1214" y2="208"/>
  <text class="mono" x="956" y="243">persona.&lt;FQN&gt;</text>
  <text class="body" x="956" y="279">navigation → 좌측 메뉴</text>
  <text class="body" x="956" y="310">pages → Custom Page</text>
  <text class="body" x="956" y="341">Landing layout → Home / My Data</text>
  <text class="small" x="956" y="369">선택값 변경을 구독한 화면이 문서를 다시 읽음</text>

  <text class="small" x="40" y="425">핵심: Persona 이름을 화면 코드에서 조건문으로 비교하지 않고, Persona에 연결된 문서 데이터를 렌더링한다.</text>
</svg>
