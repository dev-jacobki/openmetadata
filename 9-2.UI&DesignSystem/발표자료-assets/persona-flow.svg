<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="610" viewBox="0 0 1600 610" role="img" aria-labelledby="title desc">
  <title id="title">Persona 기준의 UI 문서 조회 흐름</title>
  <desc id="desc">로그인 사용자에게 기본 Persona가 설정되고 선택된 Persona의 FQN으로 DocStore 문서를 조회해 페이지와 내비게이션 UI를 구성한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0 0 L0 8 L9 4 Z" fill="#44546A"/></marker>
    <style>
      .bg{fill:#F7F9FC}.card{fill:#FFF;stroke:#A9B7C9;stroke-width:2.5}.user{fill:#F4F0FF;stroke:#7A5AF8;stroke-width:3}.selected{fill:#EAF2FF;stroke:#2F6FED;stroke-width:3}.doc{fill:#EAF8F1;stroke:#24845F;stroke-width:3}.output{fill:#FFF4E8;stroke:#E07A21;stroke-width:3}.footer{fill:#FFF;stroke:#C9D3E0;stroke-width:2}.line{stroke:#44546A;stroke-width:3;fill:none}.rule{stroke:#C9D3E0;stroke-width:1.5}.tag{font:700 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;letter-spacing:1.3px;fill:#667085}.title{font:700 31px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#172033}.name{font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#172033}.body{font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#475467}.small{font:500 15px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#667085}.mono{font:500 15px Menlo,Consolas,monospace;fill:#344054}.flow{font:700 14px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#2F6FED}.foot{font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;fill:#344054}
    </style>
  </defs>
  <rect class="bg" width="1600" height="610" rx="26"/>
  <text class="tag" x="55" y="58">Persona 상태</text>
  <text class="title" x="55" y="104">Persona 기준의 UI 문서 조회 흐름</text>
  <text class="small" x="1545" y="60" text-anchor="end">UI: Settings &gt; Personas</text>

  <rect class="user" x="55" y="160" width="275" height="270" rx="18"/>
  <text class="tag" x="85" y="202">사용자 응답</text>
  <text class="name" x="85" y="242">로그인 사용자</text>
  <path class="rule" d="M85 268 H300"/>
  <text class="mono" x="85" y="310">defaultPersona</text>
  <text class="body" x="85" y="347">기본 Persona 전달</text>
  <text class="small" x="85" y="387">초기 선택값의 기준</text>

  <path class="line" d="M330 294 H395" marker-end="url(#arrow)"/>
  <text class="flow" x="363" y="267" text-anchor="middle">초기화</text>

  <rect class="selected" x="405" y="160" width="315" height="270" rx="18"/>
  <text class="tag" x="435" y="202">애플리케이션 Store</text>
  <text class="name" x="435" y="242">현재 Persona</text>
  <path class="rule" d="M435 268 H690"/>
  <text class="mono" x="435" y="310">selectedPersona</text>
  <text class="body" x="435" y="347">선택 변경 시 상태 갱신</text>
  <text class="small" x="435" y="387">문서 조회의 직접 기준</text>

  <path class="line" d="M720 294 H785" marker-end="url(#arrow)"/>
  <text class="flow" x="753" y="267" text-anchor="middle">FQN 구성</text>

  <rect class="doc" x="795" y="160" width="365" height="270" rx="18"/>
  <text class="tag" x="825" y="202">DOCSTORE</text>
  <text class="name" x="825" y="242">Persona 문서</text>
  <path class="rule" d="M825 268 H1130"/>
  <text class="mono" x="825" y="310">persona.&lt;fullyQualifiedName&gt;</text>
  <text class="mono" x="825" y="343">getDocumentByFQN</text>
  <text class="small" x="825" y="387">페이지별 사용자 정의 값 반환</text>

  <path class="line" d="M1160 294 H1225" marker-end="url(#arrow)"/>
  <text class="flow" x="1193" y="267" text-anchor="middle">반영</text>

  <rect class="output" x="1235" y="160" width="310" height="270" rx="18"/>
  <text class="tag" x="1265" y="202">UI 적용 범위</text>
  <text class="name" x="1265" y="242">표시 UI</text>
  <path class="rule" d="M1265 268 H1515"/>
  <text class="body" x="1265" y="310">Navigation</text>
  <text class="body" x="1265" y="344">Page</text>
  <text class="body" x="1265" y="378">Landing 설정</text>

  <rect class="footer" x="55" y="485" width="1490" height="65" rx="14"/>
  <text class="foot" x="85" y="525">defaultPersona는 초기값이고, 실제 문서 조회는 현재 선택된 selectedPersona의 FQN을 사용한다.</text>
</svg>
