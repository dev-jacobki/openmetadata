<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="User 기본 Persona에서 Persona별 UI 문서를 조회하는 흐름">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#c45732"/></marker>
    <style>
      .n{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#d5dbe3;font-size:84px;font-weight:700}
      .k{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#c45732;font-size:16px;font-weight:700;letter-spacing:1px}
      .t{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:29px;font-weight:700}
      .h{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:22px;font-weight:700}
      .b{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#4c5e70;font-size:18px}
      .m{font-family:Menlo,Consolas,monospace;fill:#334155;font-size:15px}
      .s{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#718096;font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fbfcfe"/>
  <rect x="56" y="56" width="7" height="488" fill="#c45732"/>
  <text x="84" y="104" class="n">04</text>
  <text x="216" y="83" class="k">UI 페이지 · SETTINGS &gt; PERSONAS</text>
  <text x="216" y="121" class="t">Persona 기준의 UI 문서 조회</text>
  <path d="M216 146 H1140" stroke="#d9e0e8" stroke-width="2"/>

  <path d="M326 240 V435" stroke="#d9e0e8" stroke-width="2"/>
  <path d="M504 240 V435" stroke="#d9e0e8" stroke-width="2"/>
  <path d="M682 240 V435" stroke="#d9e0e8" stroke-width="2"/>
  <path d="M860 240 V435" stroke="#d9e0e8" stroke-width="2"/>
  <path d="M326 296 H504 M504 354 H682 M682 412 H860 M860 412 H1088" fill="none" stroke="#c45732" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="216" y="232" class="k">01</text>
  <text x="216" y="270" class="h">사용자</text>
  <text x="216" y="302" class="m">defaultPersona</text>
  <text x="216" y="332" class="b">로그인 사용자 기본값</text>
  <text x="216" y="361" class="s">Store 초기화에 사용</text>

  <text x="394" y="290" class="k">02</text>
  <text x="394" y="328" class="h">선택 Persona</text>
  <text x="394" y="360" class="m">selectedPersona</text>
  <text x="394" y="390" class="b">현재 UI의 기준</text>
  <text x="394" y="419" class="s">전환 시 다시 조회</text>

  <text x="572" y="348" class="k">03</text>
  <text x="572" y="386" class="h">Persona FQN</text>
  <text x="572" y="418" class="m">persona.&lt;FQN&gt;</text>
  <text x="572" y="448" class="b">문서 조회 식별자</text>
  <text x="572" y="477" class="s">DocStore 요청에 사용</text>

  <text x="750" y="406" class="k">04</text>
  <text x="750" y="444" class="h">UI 문서</text>
  <text x="750" y="476" class="m">pages · navigation</text>
  <text x="750" y="506" class="b">Persona별 구성</text>

  <text x="922" y="378" class="k">화면 반영</text>
  <text x="922" y="416" class="h">화면 반영</text>
  <text x="922" y="448" class="b">Landing Page</text>
  <text x="922" y="478" class="b">내비게이션</text>

  <text x="216" y="552" class="s">useCustomPages는 Persona FQN으로 문서를 가져온 뒤, 요청한 pageType에 해당하는 Page와 Navigation을 분리한다.</text>
</svg>
