<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title desc">
  <title id="title">Persona 개인화 흐름</title>
  <desc id="desc">서버가 사용자 지정 Persona를 우선 사용하고, 없으면 Persona.default를 대체값으로 User.defaultPersona에 채운다. Frontend는 이 값을 selectedPersona로 초기화하고 Persona 문서를 조회해 UI에 반영한다.</desc>
  <defs>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172033}
      .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#64748B}
      .cardTitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:21px;font-weight:700;fill:#172033}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#475569}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#64748B}
      .mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:600;fill:#334155}
      .flow{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#475569}
      .line{stroke:#64748B;stroke-width:3;fill:none}
      .arrow{fill:#64748B}
      .rule{stroke:#CBD5E1;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1280" height="420" fill="#FFFFFF"/>
  <text class="title" x="40" y="55">Persona 개인화 흐름</text>
  <text class="subtitle" x="40" y="89">서버가 기본 Persona를 결정해 User에 담고, Frontend는 그 값을 현재 선택 상태로 사용한다.</text>

  <rect x="40" y="135" width="200" height="230" rx="20" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  <text class="flow" x="64" y="169" fill="#EA580C">서버 처리</text>
  <text class="cardTitle" x="64" y="202">기본값 결정</text>
  <path class="rule" d="M64 222 H216"/>
  <text class="body" x="64" y="258">사용자 지정값 우선</text>
  <text class="body" x="64" y="290">없으면</text>
  <text class="mono" x="64" y="322">Persona.default</text>
  <text class="note" x="64" y="347">서버 대체값</text>

  <path class="line" d="M240 250 H270"/>
  <path class="arrow" d="M270 242 L284 250 L270 258 Z"/>
  <text class="flow" x="264" y="226" text-anchor="middle">전달</text>

  <rect x="290" y="135" width="230" height="230" rx="20" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  <text class="flow" x="314" y="169" fill="#7C3AED">로그인 응답</text>
  <text class="cardTitle" x="314" y="202">사용자 기본값</text>
  <path class="rule" d="M314 222 H496"/>
  <text class="mono" x="314" y="266">User.defaultPersona</text>
  <text class="body" x="314" y="306">서버가 결정한</text>
  <text class="note" x="314" y="336">Persona 참조</text>

  <path class="line" d="M520 250 H526"/>
  <path class="arrow" d="M526 242 L540 250 L526 258 Z"/>

  <rect x="540" y="135" width="200" height="230" rx="20" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  <text class="flow" x="564" y="169" fill="#2563EB">Frontend 상태</text>
  <text class="cardTitle" x="564" y="202">현재 Persona</text>
  <path class="rule" d="M564 222 H716"/>
  <text class="mono" x="564" y="266">selectedPersona</text>
  <text class="body" x="564" y="306">UI가 사용하는</text>
  <text class="note" x="564" y="336">현재 선택값</text>

  <path class="line" d="M740 250 H770"/>
  <path class="arrow" d="M770 242 L784 250 L770 258 Z"/>
  <text class="flow" x="764" y="226" text-anchor="middle">FQN</text>

  <rect x="790" y="135" width="200" height="230" rx="20" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  <text class="flow" x="814" y="169" fill="#059669">문서 조회</text>
  <text class="cardTitle" x="814" y="202">Persona 문서</text>
  <path class="rule" d="M814 222 H966"/>
  <text class="mono" x="814" y="266">persona.&lt;FQN&gt;</text>
  <text class="body" x="814" y="306">pages</text>
  <text class="note" x="814" y="336">navigation</text>

  <path class="line" d="M990 250 H1020"/>
  <path class="arrow" d="M1020 242 L1034 250 L1020 258 Z"/>
  <text class="flow" x="1014" y="226" text-anchor="middle">적용</text>

  <rect x="1040" y="135" width="200" height="230" rx="20" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="2"/>
  <text class="flow" x="1064" y="169" fill="#DB2777">화면 구성</text>
  <text class="cardTitle" x="1064" y="202">UI 반영</text>
  <path class="rule" d="M1064 222 H1216"/>
  <text class="body" x="1064" y="266">Navigation</text>
  <text class="body" x="1064" y="306">Page</text>
  <text class="note" x="1064" y="336">pageType으로 선택</text>
</svg>
