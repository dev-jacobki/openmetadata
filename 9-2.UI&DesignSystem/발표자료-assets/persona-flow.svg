<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="User의 기본 Persona 선택부터 Persona별 페이지와 내비게이션 구성 조회까지의 흐름">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:29px;font-weight:700;fill:#0f172a}
      .eyebrow{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2563eb;letter-spacing:.5px}
      .head{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:23px;font-weight:700;fill:#0f172a}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;fill:#475569}
      .mono{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#334155}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:16px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="56" y="54" class="eyebrow">UI 페이지 · SETTINGS &gt; PERSONAS</text>
  <text x="56" y="94" class="title">선택 Persona는 화면 조건문이 아니라, Persona별 UI 문서를 찾는 기준이다.</text>
  <path d="M56 118 H1144" stroke="#bfdbfe" stroke-width="2"/>

  <path d="M277 276 H365 M564 276 H652 M851 276 H939" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="56" y="184" width="221" height="185" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="231" class="head">User</text>
  <text x="84" y="264" class="mono">defaultPersona</text>
  <text x="84" y="297" class="body">로그인 사용자 기본값</text>
  <text x="84" y="331" class="note">Store 초기화 시 사용</text>

  <rect x="365" y="184" width="199" height="185" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="393" y="231" class="head">선택 Persona</text>
  <text x="393" y="264" class="mono">selectedPersona</text>
  <text x="393" y="297" class="body">현재 UI의 기준</text>
  <text x="393" y="331" class="note">전환 시 재조회</text>

  <rect x="652" y="184" width="199" height="185" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="680" y="231" class="head">Persona FQN</text>
  <text x="680" y="264" class="mono">persona.&lt;FQN&gt;</text>
  <text x="680" y="297" class="body">문서 조회 식별자</text>
  <text x="680" y="331" class="note">DocStore 요청에 사용</text>

  <rect x="939" y="184" width="205" height="185" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="967" y="231" class="head">UI 문서</text>
  <text x="967" y="264" class="mono">pages / navigation</text>
  <text x="967" y="297" class="body">Landing Page</text>
  <text x="967" y="326" class="body">내비게이션 구성</text>

  <rect x="56" y="430" width="1088" height="86" rx="14" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>
  <text x="84" y="466" class="eyebrow">조회 규칙</text>
  <text x="84" y="496" class="body">useCustomPages는 선택 Persona의 FQN으로 문서를 가져온 뒤, 요청한 pageType에 해당하는 Page와 Navigation을 분리한다.</text>
</svg>
