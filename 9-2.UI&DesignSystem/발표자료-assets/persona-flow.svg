<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="title desc">
  <title id="title">Persona 개인화 흐름</title>
  <desc id="desc">Persona.default는 서버 fallback이고, Frontend는 User.defaultPersona로 현재 선택 상태를 정한 뒤 FQN 문서의 Navigation과 요청한 pageType의 Page를 적용한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L8 4 L0 8 Z" fill="#53657F"/>
    </marker>
  </defs>
  <style>
    .title{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#213959}.subtitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#62738B}.cardTitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#213959}.body{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#435875}.note{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#62738B}.mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:500;fill:#314660}.label{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#2E6DD8}.line{stroke:#53657F;stroke-width:2.5;fill:none}.rule{stroke:#C4CFDC;stroke-width:1.5}.source{fill:#FFFFFF;stroke:#71839B;stroke-width:2.4}.selected{fill:#EEF5FF;stroke:#2E6DD8;stroke-width:2.8}.document{fill:#F8F6FF;stroke:#7157C9;stroke-width:2.8}.output{fill:#EFFAF4;stroke:#27875F;stroke-width:2.8}.row{fill:#F5F7FA}
  </style>
  <rect width="1280" height="470" fill="#FFFFFF"/>
  <text class="title" x="40" y="55">Persona 개인화 흐름</text>
  <text class="subtitle" x="40" y="91">User.defaultPersona를 현재 선택값으로 초기화하고, 선택 Persona의 문서에서 Navigation과 Page를 읽는다.</text>

  <rect class="source" x="55" y="145" width="285" height="250" rx="17"/>
  <text class="cardTitle" x="85" y="189">Persona 선택 기준</text>
  <path class="rule" d="M85 211 H310"/>
  <rect class="row" x="82" y="234" width="230" height="62" rx="8"/>
  <text class="mono" x="101" y="260">Persona.default</text>
  <text class="note" x="101" y="284">서버의 시스템 fallback</text>
  <rect class="row" x="82" y="309" width="230" height="62" rx="8"/>
  <text class="mono" x="101" y="335">User.defaultPersona</text>
  <text class="note" x="101" y="359">Frontend 초기값</text>

  <path class="line" d="M340 340 H373 V270 H402"/>
  <polygon points="415,270 402,263 402,277" fill="#53657F"/>
  <text class="label" x="372" y="315" text-anchor="middle">초기화</text>

  <rect class="selected" x="415" y="180" width="245" height="180" rx="17"/>
  <text class="cardTitle" x="445" y="226">현재 Persona</text>
  <path class="rule" d="M445 248 H630"/>
  <text class="mono" x="445" y="286">selectedPersona</text>
  <text class="body" x="445" y="320">fullyQualifiedName</text>
  <text class="note" x="445" y="345">UI가 사용하는 현재 상태</text>

  <path class="line" d="M660 270 H755"/>
  <polygon points="770,270 755,262 755,278" fill="#53657F"/>
  <text class="label" x="708" y="226" text-anchor="middle">FQN으로 조회</text>
  <text class="mono" x="708" y="249" text-anchor="middle">persona.&lt;FQN&gt;</text>

  <path class="document" d="M770 130 H980 L1025 175 V400 H770 Z"/>
  <path d="M980 130 V175 H1025" fill="none" stroke="#7157C9" stroke-width="2.8"/>
  <text class="cardTitle" x="800" y="204">Persona 문서</text>
  <text class="mono" x="800" y="238">persona.&lt;FQN&gt;</text>
  <path class="rule" d="M800 260 H990"/>
  <text class="body" x="800" y="298">navigation</text>
  <text class="body" x="800" y="337">pages[]</text>
  <text class="note" x="800" y="368">Persona별 UI 구성 데이터</text>

  <path class="line" d="M1025 270 H1072"/>
  <polygon points="1085,270 1072,263 1072,277" fill="#53657F"/>
  <text class="label" x="1050" y="241" text-anchor="middle">적용</text>

  <rect class="output" x="1085" y="170" width="155" height="205" rx="17"/>
  <text class="cardTitle" x="1112" y="214">UI</text>
  <path class="rule" d="M1112 235 H1213"/>
  <text class="body" x="1112" y="272">Navigation</text>
  <text class="body" x="1112" y="318">Page</text>
  <text class="note" x="1112" y="344">pageType으로</text>
  <text class="note" x="1112" y="365">pages[]에서 선택</text>
</svg>
