<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="title desc">
  <title id="title">하나의 Layout을 편집하고 다시 렌더링한다</title>
  <desc id="desc">Landing Page에서 위젯을 편집하고 Page.layout을 Persona Page에 저장한 뒤 Home 또는 My Data에서 같은 layout으로 위젯을 렌더링하는 흐름이다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#263A5A" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#1F3553}
      .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#64748B}
      .step{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#345EA8}
      .number{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#FFFFFF;text-anchor:middle}
      .cardTitle{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:700;fill:#1F3553}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#3F526D}
      .mono{font-family:Menlo,Consolas,monospace;font-size:17px;font-weight:600;fill:#314966}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:600;fill:#52667F}
      .arrowLabel{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#3B6FD8;text-anchor:middle}
      .flow{stroke:#3B6FD8;stroke-width:5;stroke-linecap:round;fill:none}
    </style>
  </defs>

  <rect width="1280" height="510" fill="#FFFFFF"/>
  <text class="title" x="40" y="54">하나의 Layout을 편집하고 다시 렌더링한다</text>
  <text class="subtitle" x="40" y="87">편집한 Page.layout을 Persona Page에 저장하고, Home / My Data가 같은 값을 읽어 위젯을 구성한다.</text>

  <path class="flow" d="M380 292 H440"/>
  <path d="M458 292 L438 281 V303 Z" fill="#3B6FD8"/>
  <text class="arrowLabel" x="419" y="266">저장</text>
  <path class="flow" d="M810 292 H870"/>
  <path d="M888 292 L868 281 V303 Z" fill="#3B6FD8"/>
  <text class="arrowLabel" x="849" y="266">조회</text>

  <g filter="url(#shadow)">
    <rect x="40" y="125" width="340" height="335" rx="22" fill="#EFF6FF" stroke="#B9D3FA" stroke-width="2"/>
  </g>
  <circle cx="76" cy="169" r="18" fill="#4F7FDC"/>
  <text class="number" x="76" y="175">1</text>
  <text class="step" x="106" y="175">편집</text>
  <text class="cardTitle" x="68" y="224">Landing Page 편집</text>
  <circle cx="76" cy="270" r="5" fill="#4F7FDC"/>
  <text class="body" x="94" y="277">드래그로 위젯 이동</text>
  <circle cx="76" cy="312" r="5" fill="#4F7FDC"/>
  <text class="body" x="94" y="319">위젯 추가 · 삭제</text>
  <rect x="68" y="365" width="284" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.82"/>
  <text class="note" x="88" y="400">크기 조절은 비활성화</text>

  <g filter="url(#shadow)">
    <rect x="470" y="125" width="340" height="335" rx="22" fill="#F5F3FF" stroke="#CEC5F7" stroke-width="2"/>
  </g>
  <circle cx="506" cy="169" r="18" fill="#8069D9"/>
  <text class="number" x="506" y="175">2</text>
  <text class="step" x="536" y="175" fill="#6650B8">저장</text>
  <text class="cardTitle" x="498" y="224">Persona Page 저장</text>
  <text class="mono" x="498" y="277">Page.layout</text>
  <text class="body" x="498" y="309">Landing 구현: WidgetConfig[]</text>
  <rect x="498" y="365" width="284" height="58" rx="12" fill="#FFFFFF" fill-opacity="0.82"/>
  <text class="note" x="518" y="400">i · x · y · w · h 저장</text>

  <g filter="url(#shadow)">
    <rect x="900" y="125" width="340" height="335" rx="22" fill="#ECFDF5" stroke="#B7E7D1" stroke-width="2"/>
  </g>
  <circle cx="936" cy="169" r="18" fill="#3C9A72"/>
  <text class="number" x="936" y="175">3</text>
  <text class="step" x="966" y="175" fill="#287D5A">렌더링</text>
  <text class="cardTitle" x="928" y="224">Home / My Data</text>
  <circle cx="936" cy="270" r="5" fill="#3C9A72"/>
  <text class="body" x="954" y="277">layout[]을 순서대로 순회</text>
  <circle cx="936" cy="312" r="5" fill="#3C9A72"/>
  <text class="body" x="954" y="319">i로 React 컴포넌트 선택</text>
  <rect x="928" y="353" width="284" height="82" rx="12" fill="#FFFFFF" fill-opacity="0.82"/>
  <text class="note" x="948" y="384">기본 위젯: Activity Feed · KPI</text>
  <text class="note" x="948" y="410">Data Assets · Following</text>
</svg>
