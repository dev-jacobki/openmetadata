<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">layout은 배치를, widget key는 화면을 결정한다</title>
  <desc id="desc">Persona별 Landing Page 설정 문서의 Page.layout과 WidgetConfig 키가 Home 또는 My Data 화면에서 위젯 위치와 컴포넌트를 결정한다.</desc>
  <defs>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:37px;font-weight:700;fill:#213959}.route{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#62738B}.cardTitle{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:23px;font-weight:700;fill:#213959}.label{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:700;fill:#2E6DD8}.body{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#435875}.note{font-family:'Apple SD Gothic Neo','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#62738B}.mono{font-family:Menlo,Consolas,monospace;font-size:16px;font-weight:500;fill:#314660}.line{stroke:#485B78;stroke-width:3;fill:none}.rule{stroke:#B5C4D6;stroke-width:2}.document{fill:#F8F6FF;stroke:#7157C9;stroke-width:3}.screen{fill:#FFFFFF;stroke:#71839B;stroke-width:2.5}.header{fill:#F3F6FA}.widgetA{fill:#EEF5FF;stroke:#2E6DD8;stroke-width:2}.widgetB{fill:#EFFAF4;stroke:#27875F;stroke-width:2}.widgetC{fill:#FFF8F0;stroke:#C66A16;stroke-width:2}.widgetD{fill:#F8F6FF;stroke:#7157C9;stroke-width:2}
    </style>
  </defs>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <text class="title" x="40" y="66">layout은 배치를, widget key는 화면을 결정한다</text>
  <text class="route" x="40" y="104">UI: Settings &gt; Personas &gt; &lt;Persona&gt; &gt; Customize UI &gt; Landing Page</text>

  <path class="document" d="M60 180 H420 L465 225 V570 H60 Z"/>
  <path d="M420 180 V225 H465" fill="none" stroke="#7157C9" stroke-width="3"/>
  <text class="cardTitle" x="92" y="235">저장된 Persona 문서</text>
  <path class="rule" d="M92 258 H430"/>
  <text class="label" x="92" y="300">Page.layout</text>
  <rect x="92" y="322" width="142" height="78" rx="8" fill="#FFFFFF" stroke="#B7A9E0" stroke-width="1.5"/>
  <rect x="102" y="332" width="75" height="25" rx="4" fill="#DDEBFF"/>
  <rect x="185" y="332" width="39" height="25" rx="4" fill="#E5F5EB"/>
  <rect x="102" y="365" width="39" height="25" rx="4" fill="#FFF0DE"/>
  <rect x="149" y="365" width="75" height="25" rx="4" fill="#EEE9FF"/>
  <text class="note" x="255" y="354">x · y · w · h</text>
  <text class="note" x="255" y="382">위치와 크기</text>
  <text class="label" x="92" y="455">WidgetConfig.key</text>
  <text class="mono" x="92" y="492">activityFeed · kpi</text>
  <text class="mono" x="92" y="523">tasks · recentlyViewed</text>

  <path class="line" d="M465 335 H602"/>
  <polygon points="615,335 602,328 602,342" fill="#485B78"/>
  <text class="label" x="540" y="305" text-anchor="middle">레이아웃 적용</text>
  <path class="line" d="M465 490 H602"/>
  <polygon points="615,490 602,483 602,497" fill="#485B78"/>
  <text class="label" x="540" y="528" text-anchor="middle">위젯 매핑</text>

  <rect class="screen" x="630" y="165" width="570" height="430" rx="12"/>
  <rect class="header" x="631" y="166" width="568" height="62" rx="11"/>
  <path class="rule" d="M631 228 H1199"/>
  <text class="cardTitle" x="660" y="205">Home / My Data</text>
  <text class="note" x="1135" y="205" text-anchor="end">Persona별 Landing Page</text>

  <rect class="widgetA" x="660" y="255" width="305" height="132" rx="12"/>
  <text class="cardTitle" x="685" y="302">Activity Feed</text>
  <text class="note" x="685" y="337">활동 내역</text>
  <rect class="widgetB" x="990" y="255" width="180" height="62" rx="12"/>
  <text class="body" x="1010" y="294">KPI</text>
  <rect class="widgetC" x="990" y="340" width="180" height="118" rx="12"/>
  <text class="body" x="1010" y="382">Tasks</text>
  <rect class="widgetD" x="660" y="412" width="305" height="150" rx="12"/>
  <text class="cardTitle" x="685" y="460">Recently Viewed</text>
  <text class="note" x="685" y="495">최근 조회한 엔티티</text>
</svg>
