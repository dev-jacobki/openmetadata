<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="Persona Landing Page의 위젯 편집, 레이아웃 저장, 화면 렌더링 흐름">
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:29px;font-weight:700;fill:#0f172a}
      .eyebrow{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2563eb;letter-spacing:.5px}
      .eyebrowLight{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#93c5fd;letter-spacing:.5px}
      .head{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:23px;font-weight:700;fill:#0f172a}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;fill:#475569}
      .mono{font-family:Menlo,Consolas,monospace;font-size:15px;fill:#334155}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:16px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" fill="#f8fafc"/>
  <text x="56" y="54" class="eyebrow">설정 UI · SETTINGS &gt; PERSONAS &gt; &lt;PERSONA&gt; &gt; CUSTOMIZE UI &gt; LANDING PAGE</text>
  <text x="56" y="94" class="title">위젯 구현과 레이아웃 데이터가 분리되어 Persona별 시작 화면을 구성한다.</text>
  <path d="M56 118 H1144" stroke="#bfdbfe" stroke-width="2"/>

  <path d="M282 273 H365 M570 273 H653 M858 273 H941" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="56" y="175" width="226" height="196" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="220" class="head">레이아웃 편집</text>
  <text x="84" y="252" class="mono">react-grid-layout</text>
  <text x="84" y="286" class="body">위젯 추가 · 제거</text>
  <text x="84" y="315" class="body">드래그 · 크기 · 순서</text>
  <text x="84" y="343" class="note">설정 화면에서 수정</text>

  <rect x="365" y="175" width="205" height="196" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="393" y="220" class="head">WidgetConfig[]</text>
  <text x="393" y="252" class="body">widget key</text>
  <text x="393" y="281" class="body">grid 좌표 · 크기</text>
  <text x="393" y="310" class="body">정렬 순서</text>
  <text x="393" y="343" class="note">변경된 layout 값</text>

  <rect x="653" y="175" width="205" height="196" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="681" y="220" class="head">Persona Page</text>
  <text x="681" y="252" class="mono">Page.layout</text>
  <text x="681" y="286" class="body">Persona 문서에 저장</text>
  <text x="681" y="315" class="body">Landing Page 데이터</text>
  <text x="681" y="343" class="note">선택 Persona별 분리</text>

  <rect x="941" y="175" width="203" height="196" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="969" y="220" class="head">Home / My Data</text>
  <text x="969" y="252" class="mono">getWidgetFromKey()</text>
  <text x="969" y="286" class="body">key를 컴포넌트로</text>
  <text x="969" y="315" class="body">매핑해 렌더링</text>
  <text x="969" y="343" class="note">사용자 시작 화면</text>

  <rect x="56" y="430" width="1088" height="88" rx="14" fill="#0f172a"/>
  <text x="84" y="466" class="eyebrowLight">대표 위젯</text>
  <text x="84" y="496" font-family="'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif" font-size="18" fill="#e2e8f0">Activity Feed · KPI · Announcements · Tasks · Recently Viewed</text>
</svg>
