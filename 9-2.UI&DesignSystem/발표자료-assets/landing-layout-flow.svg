<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-label="Persona landing page widget layout flow">
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker>
    <style>.s{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#475569;font-size:18px}.h{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#0f172a;font-size:25px;font-weight:700}.k{font-family:Arial,'Apple SD Gothic Neo',sans-serif;fill:#2563eb;font-size:18px;font-weight:700}</style>
  </defs>
  <rect width="960" height="360" fill="#f8fafc"/><text x="56" y="58" class="k">CONFIGURE · PERSONA LANDING PAGE    /    RENDER · HOME / MY DATA</text>
  <path d="M290 194 H390 M600 194 H700" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#a)"/>
  <rect x="56" y="126" width="234" height="136" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="84" y="176" class="h">Layout edit</text><text x="84" y="212" class="s">add · remove</text><text x="84" y="238" class="s">rearrange widgets</text>
  <rect x="390" y="126" width="210" height="136" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/><text x="418" y="176" class="h">Page data</text><text x="418" y="212" class="s">Persona page</text><text x="418" y="238" class="s">layout stored</text>
  <rect x="700" y="126" width="204" height="136" rx="14" fill="#fff" stroke="#cbd5e1" stroke-width="2"/><text x="728" y="176" class="h">Widgets</text><text x="728" y="212" class="s">Activity · KPI</text><text x="728" y="238" class="s">Tasks · Recent</text>
  <text x="56" y="320" class="s">A selected Persona determines which Landing Page layout is read.</text>
</svg>
