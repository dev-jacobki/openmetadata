<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-label="OpenMetadata 앱 UI와 공유 디자인 시스템의 구조">
  <defs>
    <linearGradient id="bg" x1="0" x2="1"><stop stop-color="#f8fafc"/><stop offset="1" stop-color="#eef6ff"/></linearGradient>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0,0 L0,8 L10,4 z" fill="#2563eb"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:29px;font-weight:700;fill:#0f172a}
      .eyebrow{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#2563eb;letter-spacing:.5px}
      .eyebrowLight{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:17px;font-weight:700;fill:#93c5fd;letter-spacing:.5px}
      .head{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:24px;font-weight:700;fill:#0f172a}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:18px;fill:#475569}
      .mono{font-family:Menlo,Consolas,monospace;font-size:16px;fill:#334155}
      .small{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;font-size:16px;fill:#64748b}
    </style>
  </defs>
  <rect width="1200" height="580" fill="url(#bg)"/>
  <text x="56" y="54" class="eyebrow">UI 구조</text>
  <text x="56" y="94" class="title">앱 UI와 공유 디자인 시스템은 역할을 나누고, 패키지로 연결된다.</text>
  <path d="M56 118 H1144" stroke="#bfdbfe" stroke-width="2"/>

  <rect x="56" y="154" width="440" height="258" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="56" y="154" width="440" height="10" rx="5" fill="#2563eb"/>
  <text x="84" y="208" class="head">공유 UI 패키지</text>
  <text x="84" y="238" class="mono">openmetadata-ui-core-components</text>
  <path d="M84 263 H468" stroke="#dbeafe" stroke-width="2"/>
  <text x="84" y="298" class="body">기본 요소  ·  Button, Input, Card</text>
  <text x="84" y="329" class="body">응용 요소  ·  Table, Tabs, Navigation</text>
  <text x="84" y="360" class="body">공통 기반  ·  Theme, colors, utilities</text>
  <text x="84" y="394" class="small">공개 API: theme · components · colors · utils</text>

  <path d="M500 282 H690" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="555" y="264" class="eyebrow">로컬 링크 연결</text>

  <rect x="704" y="154" width="440" height="258" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="704" y="154" width="440" height="10" rx="5" fill="#0f172a"/>
  <text x="732" y="208" class="head">OpenMetadata 앱 UI</text>
  <text x="732" y="238" class="mono">openmetadata-ui/src/main/resources/ui</text>
  <path d="M732 263 H1116" stroke="#e2e8f0" stroke-width="2"/>
  <text x="732" y="298" class="body">Page와 도메인별 components 조합</text>
  <text x="732" y="329" class="body">REST API, hooks, Zustand Store 연결</text>
  <text x="732" y="360" class="body">서비스·엔티티·설정 화면 구현</text>
  <text x="732" y="394" class="small">앱 전용 로직은 공유 패키지 밖에서 유지</text>

  <rect x="56" y="454" width="1088" height="78" rx="14" fill="#0f172a"/>
  <text x="84" y="484" class="eyebrowLight">빌드 순서</text>
  <text x="84" y="514" font-family="Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">preinstall: core components build</text>
  <path d="M430 506 H548" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="572" y="514" font-family="Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">UI yarn install</text>
  <path d="M790 506 H908" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="934" y="514" font-family="Menlo,Consolas,monospace" font-size="18" fill="#e2e8f0">Vite start</text>
</svg>
