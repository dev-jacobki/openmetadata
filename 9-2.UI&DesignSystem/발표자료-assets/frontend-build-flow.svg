<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="570" viewBox="0 0 1280 570" role="img" aria-labelledby="title desc">
  <title id="title">Frontend 소스 구조</title>
  <desc id="desc">openmetadata-ui 애플리케이션의 src는 pages, components, context와 hooks, rest, generated와 jsons를 역할별로 나눈다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#27405F" flood-opacity="0.10"/>
    </filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:36px;font-weight:700;fill:#172033}
      .subtitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#64748B}
      .rootTitle{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:700;fill:#172033}
      .code{font-family:Menlo,Consolas,monospace;font-size:18px;font-weight:700;fill:#334155}
      .branch{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:19px;font-weight:700;fill:#172033}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#475569}
      .tag{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:700;fill:#2563EB}
      .tree{stroke:#7B8DA8;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .rule{stroke:#CBD5E1;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1280" height="570" fill="#FFFFFF"/>
  <text class="title" x="40" y="55">Frontend 소스 구조</text>
  <text class="subtitle" x="40" y="89">실행 앱의 src는 화면, 재사용 UI, 공유 상태, API, Schema 산출물을 역할별로 나눈다.</text>

  <g filter="url(#shadow)">
    <rect x="40" y="224" width="280" height="130" rx="22" fill="#EAF3FF" stroke="#9FC2F2" stroke-width="2"/>
  </g>
  <text class="tag" x="70" y="262">애플리케이션 소스</text>
  <text class="rootTitle" x="70" y="302">openmetadata-ui</text>
  <path class="rule" d="M70 320 H290"/>
  <text class="code" x="70" y="343">src/</text>

  <path class="tree" d="M320 289 H370 V147"/>
  <path class="tree" d="M370 147 V483"/>
  <path class="tree" d="M370 147 H430"/>
  <path class="tree" d="M370 231 H430"/>
  <path class="tree" d="M370 315 H430"/>
  <path class="tree" d="M370 399 H430"/>
  <path class="tree" d="M370 483 H430"/>
  <circle cx="370" cy="147" r="5" fill="#7B8DA8"/>
  <circle cx="370" cy="231" r="5" fill="#7B8DA8"/>
  <circle cx="370" cy="315" r="5" fill="#7B8DA8"/>
  <circle cx="370" cy="399" r="5" fill="#7B8DA8"/>
  <circle cx="370" cy="483" r="5" fill="#7B8DA8"/>

  <g filter="url(#shadow)">
    <rect x="430" y="112" width="810" height="70" rx="18" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="2"/>
  </g>
  <text class="code" x="462" y="155">pages/</text>
  <text class="branch" x="620" y="155">URL 기반 업무 화면</text>
  <text class="body" x="896" y="155">Service · Theme · Persona · My Data</text>

  <g filter="url(#shadow)">
    <rect x="430" y="196" width="810" height="70" rx="18" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="2"/>
  </g>
  <text class="code" x="462" y="239">components/</text>
  <text class="branch" x="620" y="239">기능·공통 UI 조합</text>
  <text class="body" x="896" y="239">화면 안에서 재사용하는 구성 단위</text>

  <g filter="url(#shadow)">
    <rect x="430" y="280" width="810" height="70" rx="18" fill="#FFF7ED" stroke="#FED7AA" stroke-width="2"/>
  </g>
  <text class="code" x="462" y="323">context/ · hooks/</text>
  <text class="branch" x="720" y="323">공유 상태·동작</text>
  <text class="body" x="950" y="323">인증 · Theme · 사용자 선택값</text>

  <g filter="url(#shadow)">
    <rect x="430" y="364" width="810" height="70" rx="18" fill="#FEF2F2" stroke="#FECACA" stroke-width="2"/>
  </g>
  <text class="code" x="462" y="407">rest/</text>
  <text class="branch" x="620" y="407">OpenMetadata REST API</text>
  <text class="body" x="968" y="407">Server와 데이터 교환</text>

  <g filter="url(#shadow)">
    <rect x="430" y="448" width="810" height="70" rx="18" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="2"/>
  </g>
  <text class="code" x="462" y="491">generated/ · jsons/</text>
  <text class="branch" x="720" y="491">Schema 산출물</text>
  <text class="body" x="950" y="491">TypeScript 타입 · Form용 JSON</text>
</svg>
