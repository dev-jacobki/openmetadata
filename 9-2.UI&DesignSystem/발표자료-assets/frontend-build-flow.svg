<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-label="OpenMetadata 앱 UI와 공유 UI 패키지의 역할 및 빌드 순서">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M0,0 L0,8 L9,4 z" fill="#c45732"/></marker>
    <style>
      .n{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#d5dbe3;font-size:84px;font-weight:700}
      .k{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#c45732;font-size:16px;font-weight:700;letter-spacing:1px}
      .t{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:29px;font-weight:700}
      .h{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#11253d;font-size:22px;font-weight:700}
      .b{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#4c5e70;font-size:18px}
      .m{font-family:Menlo,Consolas,monospace;fill:#334155;font-size:15px}
      .s{font-family:'Apple SD Gothic Neo','Noto Sans CJK KR',Arial,sans-serif;fill:#718096;font-size:15px}
    </style>
  </defs>
  <rect width="1200" height="600" fill="#fbfcfe"/>
  <rect x="56" y="56" width="7" height="488" fill="#c45732"/>
  <text x="84" y="104" class="n">01</text>
  <text x="216" y="83" class="k">UI 구조</text>
  <text x="216" y="121" class="t">앱 UI와 공유 UI 패키지의 역할 분리</text>
  <path d="M216 146 H1140" stroke="#d9e0e8" stroke-width="2"/>

  <text x="216" y="205" class="k">공유 디자인 시스템</text>
  <text x="216" y="240" class="h">openmetadata-ui-core-components</text>
  <text x="216" y="270" class="m">@openmetadata/ui-core-components</text>
  <path d="M216 292 H520" stroke="#c45732" stroke-width="3"/>
  <text x="216" y="329" class="b">기본 요소</text><text x="330" y="329" class="b">Button · Input · Card</text>
  <text x="216" y="364" class="b">응용 요소</text><text x="330" y="364" class="b">Table · Tabs · Navigation</text>
  <text x="216" y="399" class="b">공통 기반</text><text x="330" y="399" class="b">Theme · colors · utilities</text>
  <text x="216" y="431" class="s">공개 API: theme · components · colors · utils</text>

  <path d="M540 328 H664" fill="none" stroke="#c45732" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="548" y="304" class="k">연결</text>

  <text x="704" y="205" class="k">앱 UI</text>
  <text x="704" y="240" class="h">openmetadata-ui</text>
  <text x="704" y="270" class="m">src/main/resources/ui</text>
  <path d="M704 292 H1088" stroke="#11253d" stroke-width="3"/>
  <text x="704" y="329" class="b">화면 조합</text><text x="830" y="329" class="b">Page · 도메인 components</text>
  <text x="704" y="364" class="b">앱 로직</text><text x="830" y="364" class="b">REST API · hooks · Store</text>
  <text x="704" y="399" class="b">업무 화면</text><text x="830" y="399" class="b">서비스 · 엔티티 · 설정</text>
  <text x="704" y="431" class="s">앱 전용 흐름은 공유 패키지 밖에서 유지</text>

  <path d="M216 488 H1088" stroke="#d9e0e8" stroke-width="2"/>
  <text x="216" y="521" class="k">빌드 순서</text>
  <text x="216" y="551" class="m">preinstall: core components build</text>
  <path d="M520 544 H620" fill="none" stroke="#c45732" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="646" y="551" class="m">UI yarn install</text>
  <path d="M808 544 H908" fill="none" stroke="#c45732" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="934" y="551" class="m">Vite start</text>
