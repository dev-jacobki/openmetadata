<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500" role="img" aria-labelledby="title desc">
  <title id="title">공유 UI 컴포넌트의 재사용 수준과 역할</title>
  <desc id="desc">base와 foundations에서 application으로 조립된다. base는 기능과 상호작용, foundations는 시각 표현을 맡는다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-12%" width="120%" height="130%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#203B5C" flood-opacity=".10"/></filter>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:30px;font-weight:700;fill:#172B4D}
      .sub{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#5B6B80}
      .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;fill:#3867A8}
      .heading{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:25px;font-weight:700;fill:#172B4D}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#40536E}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#60748F}
      .line{stroke:#587492;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>

  <rect width="760" height="500" fill="#FFFFFF"/>
  <text class="title" x="32" y="47">공유 UI 컴포넌트의 재사용 수준과 역할</text>
  <text class="sub" x="32" y="76">낮은 수준의 기능·표현 부품을 조합해 화면 단위 UI를 만든다.</text>

  <g filter="url(#shadow)">
    <rect x="100" y="116" width="560" height="104" rx="16" fill="#EDF5FF" stroke="#AFCBF0" stroke-width="2"/>
  </g>
  <text class="label" x="128" y="145">상위 조합 부품</text>
  <text class="heading" x="128" y="180">application</text>
  <text class="body" x="298" y="180">Table · Modal · Navigation · Tabs</text>
  <text class="note" x="128" y="204">base와 foundations를 조합해 화면에 놓는 UI</text>

  <path class="line" d="M200 330 C200 280 270 270 307 237"/>
  <path d="M318 228 L312 243 L303 232 Z" fill="#587492"/>
  <path class="line" d="M560 330 C560 280 490 270 453 237"/>
  <path d="M442 228 L448 243 L457 232 Z" fill="#587492"/>
  <text class="label" x="380" y="278" text-anchor="middle">조립 방향</text>

  <g filter="url(#shadow)">
    <rect x="40" y="330" width="320" height="120" rx="16" fill="#F1FAF6" stroke="#B9E1CC" stroke-width="2"/>
  </g>
  <text class="label" x="68" y="359">기능·상호작용</text>
  <text class="heading" x="68" y="392">base</text>
  <text class="body" x="68" y="421">Button · Input · Checkbox</text>

  <g filter="url(#shadow)">
    <rect x="400" y="330" width="320" height="120" rx="16" fill="#FFF9EE" stroke="#E8D1A5" stroke-width="2"/>
  </g>
  <text class="label" x="428" y="359">시각 표현</text>
  <text class="heading" x="428" y="392">foundations</text>
  <text class="body" x="428" y="421">Typography · Dot · Featured Icon</text>

  <text class="note" x="380" y="482" text-anchor="middle">base와 foundations는 같은 낮은 재사용 수준이며 필요할 때 서로 참조한다.</text>
</svg>
