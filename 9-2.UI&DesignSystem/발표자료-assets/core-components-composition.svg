<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">공유 UI 컴포넌트의 재사용 수준과 역할</title>
  <desc id="desc">base와 foundations는 비슷한 낮은 재사용 수준의 공통 부품이다. base는 기능과 상호작용, foundations는 시각 표현을 맡으며 application이 이들을 조합한다.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-15%" width="120%" height="135%"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#223B5A" flood-opacity=".10"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#587492"/></marker>
    <style>
      .title{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:34px;font-weight:700;fill:#172B4D}
      .sub{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:18px;font-weight:500;fill:#5B6B80}
      .label{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:15px;font-weight:700;letter-spacing:.5px;fill:#3867A8}
      .heading{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:25px;font-weight:700;fill:#172B4D}
      .body{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:17px;font-weight:500;fill:#40536E}
      .note{font-family:'Apple SD Gothic Neo','Noto Sans KR','Helvetica Neue',Arial,sans-serif;font-size:16px;font-weight:500;fill:#60748F}
      .line{stroke:#587492;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#8CA3BA;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-dasharray:7 8}
      .rule{stroke:#D6E1EC;stroke-width:1.5}
    </style>
  </defs>

  <rect width="1120" height="430" fill="#FFFFFF"/>
  <text class="title" x="40" y="54">공유 UI 컴포넌트의 재사용 수준과 역할</text>
  <text class="sub" x="40" y="86">base와 foundations는 비슷한 낮은 재사용 수준이다. application은 이 부품을 조합해 화면에 배치한다.</text>

  <text class="label" x="370" y="125">상위 조합 부품</text>
  <g filter="url(#shadow)">
    <rect x="350" y="142" width="420" height="92" rx="18" fill="#EDF5FF" stroke="#AFCBF0" stroke-width="2"/>
  </g>
  <text class="heading" x="380" y="179">application</text>
  <text class="body" x="380" y="209">Table · Modal · Tabs · Navigation</text>
  <text class="note" x="380" y="228">재사용 가능한 화면 조합 부품</text>

  <path class="line" d="M560 234 V258 H294 V280" marker-end="url(#arrow)"/>
  <path class="dash" d="M560 258 H826 V280" marker-end="url(#arrow)"/>
  <text class="label" x="359" y="253">주로 조합</text>
  <text class="label" x="722" y="253">표현 필요 시 조합</text>

  <text class="label" x="72" y="267">낮은 재사용 수준 · 기능 중심</text>
  <g filter="url(#shadow)">
    <rect x="72" y="282" width="444" height="112" rx="18" fill="#F1FAF6" stroke="#B9E1CC" stroke-width="2"/>
  </g>
  <text class="heading" x="100" y="323">base</text>
  <text class="body" x="100" y="354">Button · Input · Checkbox · Tooltip</text>
  <text class="note" x="100" y="378">입력·선택·클릭을 맡는 공통 부품</text>

  <text class="label" x="604" y="267">낮은 재사용 수준 · 표현 중심</text>
  <g filter="url(#shadow)">
    <rect x="604" y="282" width="444" height="112" rx="18" fill="#FFF9EE" stroke="#E8D1A5" stroke-width="2"/>
  </g>
  <text class="heading" x="632" y="323">foundations</text>
  <text class="body" x="632" y="354">Typography · Dot · Featured Icon</text>
  <text class="note" x="632" y="378">글자·아이콘·강조 표현을 맡는 공통 부품</text>

  <path class="dash" d="M516 338 H604"/>
  <text class="note" x="560" y="329" text-anchor="middle">서로 참조 가능</text>
</svg>
