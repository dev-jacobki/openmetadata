<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata REST API CRUD 흐름</title>
  <desc id="desc">curl, Python SDK, Java SDK가 REST API를 통해 OpenMetadata 엔티티를 생성, 조회, 수정, 삭제하고 버전을 조회하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2; rx:18; }
      .api { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; rx:22; }
      .entity { fill:#EAF8F1; stroke:#24845F; stroke-width:3; rx:22; }
      .pill { fill:#FFFFFF; stroke:#CAD3DF; stroke-width:2; rx:14; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 25px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:600 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#344054; }
      .method { font:700 20px ui-monospace,SFMono-Regular,Menlo,monospace; fill:#2F6FED; }
      .caption { font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#667085; }
    </style>
  </defs>
  <rect class="bg" width="1600" height="520" rx="26"/>
  <text class="title" x="70" y="65">REST API로 엔티티를 다루는 기본 흐름</text>

  <rect class="box" x="70" y="120" width="300" height="250"/>
  <text class="label" x="220" y="170" text-anchor="middle">호출하는 쪽</text>
  <rect class="pill" x="110" y="205" width="220" height="44"/>
  <text class="small" x="220" y="234" text-anchor="middle">curl</text>
  <rect class="pill" x="110" y="265" width="220" height="44"/>
  <text class="small" x="220" y="294" text-anchor="middle">Python SDK</text>
  <rect class="pill" x="110" y="325" width="220" height="44"/>
  <text class="small" x="220" y="354" text-anchor="middle">Java SDK</text>

  <path class="line" d="M370 245 H565"/>
  <rect class="api" x="570" y="170" width="360" height="150"/>
  <text class="label" x="750" y="235" text-anchor="middle">OpenMetadata</text>
  <text class="label" x="750" y="275" text-anchor="middle">REST API</text>

  <path class="line" d="M930 245 H1125"/>
  <rect class="entity" x="1130" y="170" width="400" height="150"/>
  <text class="label" x="1330" y="235" text-anchor="middle">Metadata Entity</text>
  <text class="small" x="1330" y="277" text-anchor="middle">Table · Topic · Dashboard · …</text>

  <rect class="pill" x="455" y="395" width="180" height="62"/>
  <text class="method" x="545" y="420" text-anchor="middle">POST</text>
  <text class="caption" x="545" y="445" text-anchor="middle">Create</text>
  <rect class="pill" x="650" y="395" width="180" height="62"/>
  <text class="method" x="740" y="420" text-anchor="middle">GET</text>
  <text class="caption" x="740" y="445" text-anchor="middle">Get · List</text>
  <rect class="pill" x="845" y="395" width="180" height="62"/>
  <text class="method" x="935" y="420" text-anchor="middle">PUT</text>
  <text class="caption" x="935" y="445" text-anchor="middle">Create · Update</text>
  <rect class="pill" x="1040" y="395" width="180" height="62"/>
  <text class="method" x="1130" y="420" text-anchor="middle">PATCH</text>
  <text class="caption" x="1130" y="445" text-anchor="middle">Partial Update</text>
  <rect class="pill" x="1235" y="395" width="180" height="62"/>
  <text class="method" x="1325" y="420" text-anchor="middle">DELETE</text>
  <text class="caption" x="1325" y="445" text-anchor="middle">Delete</text>
</svg>
