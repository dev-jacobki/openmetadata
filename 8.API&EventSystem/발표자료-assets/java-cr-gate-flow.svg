<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">LDAP 사용자와 Change Request를 Java API에 적용하는 공통 CR Gate</title>
  <desc id="desc">LDAP로 식별한 요청자와 승인자의 Change Request 결과, Bot JWT가 포함된 Java 쓰기 요청을 공통 Java Filter와 EntityResource가 검증한 뒤 Repository와 메타데이터 DB에 반영하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D92D20"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .identity { fill:#EAF8F1; stroke:#24845F; stroke-width:3; }
      .request { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .filter { fill:#F4F0FF; stroke:#7A5AF8; stroke-width:3; }
      .resource { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; }
      .db { fill:#FFF4E8; stroke:#E07A21; stroke-width:3; }
      .blocked { fill:#FFF1F0; stroke:#D92D20; stroke-width:2.5; }
      .success { fill:#F0FDF4; stroke:#24845F; stroke-width:2.5; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .redLine { stroke:#D92D20; stroke-width:3; fill:none; marker-end:url(#redArrow); }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .code { font:600 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#344054; }
      .bad { font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#B42318; }
      .ok { font:650 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#176B4D; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="620" rx="26"/>
  <text class="title" x="55" y="60">모든 Java C/U/D를 한 경로에서 승인 검증</text>

  <rect class="identity" x="40" y="110" width="320" height="155" rx="18"/>
  <text class="label" x="200" y="153" text-anchor="middle">Change Request 결과</text>
  <text class="small" x="200" y="191" text-anchor="middle">요청자·승인자: LDAP 고정 ID</text>
  <text class="small" x="200" y="224" text-anchor="middle">CR ID · 상태 · Payload Hash</text>

  <rect class="request" x="40" y="330" width="320" height="155" rx="18"/>
  <text class="label" x="200" y="373" text-anchor="middle">Java C/U/D 요청</text>
  <text class="small" x="200" y="411" text-anchor="middle">전용 Bot JWT · Execution ID</text>
  <text class="small" x="200" y="444" text-anchor="middle">POST · PUT · PATCH · DELETE</text>

  <path class="line" d="M360 188 H405 V250 H445"/>
  <path class="line" d="M360 408 H405 V350 H445"/>

  <rect class="filter" x="450" y="165" width="360" height="270" rx="20"/>
  <text class="label" x="630" y="210" text-anchor="middle">Java CR Gate</text>
  <text class="code" x="630" y="250" text-anchor="middle">ContainerRequestFilter</text>
  <text class="small" x="630" y="288" text-anchor="middle">승인 상태 · 사용자 · 대상 · Hash 검증</text>
  <text class="code" x="630" y="328" text-anchor="middle">@CrControlled / @CrExempt</text>
  <text class="small" x="630" y="366" text-anchor="middle">모든 쓰기는 기본 통제</text>
  <text class="small" x="630" y="398" text-anchor="middle">예외만 명시적으로 허용</text>

  <path class="line" d="M810 300 H895"/>
  <rect class="resource" x="900" y="165" width="290" height="270" rx="20"/>
  <text class="label" x="1045" y="210" text-anchor="middle">EntityResource</text>
  <text class="code" x="1045" y="252" text-anchor="middle">create</text>
  <text class="code" x="1045" y="284" text-anchor="middle">createOrUpdate</text>
  <text class="code" x="1045" y="316" text-anchor="middle">patchInternal</text>
  <text class="code" x="1045" y="348" text-anchor="middle">delete</text>
  <text class="small" x="1045" y="394" text-anchor="middle">실제 C/U/D와 옵션 재검증</text>

  <path class="line" d="M1190 300 H1275"/>
  <rect class="db" x="1280" y="165" width="280" height="270" rx="20"/>
  <text class="label" x="1420" y="210" text-anchor="middle">Repository · DB</text>
  <text class="small" x="1420" y="253" text-anchor="middle">Metadata Entity 변경</text>
  <text class="small" x="1420" y="286" text-anchor="middle">실행 결과와 Version 기록</text>
  <text class="small" x="1420" y="332" text-anchor="middle">성공 응답 이후</text>
  <text class="code" x="1420" y="367" text-anchor="middle">change_event</text>
  <text class="small" x="1420" y="397" text-anchor="middle">별도 저장</text>

  <path class="redLine" d="M630 435 V505"/>
  <rect class="blocked" x="405" y="510" width="450" height="75" rx="15"/>
  <text class="bad" x="630" y="544" text-anchor="middle">반려 · 취소 · 불일치</text>
  <text class="small" x="630" y="570" text-anchor="middle">Resource 실행과 DB 변경 없음</text>

  <path class="line" d="M1370 435 V505"/>
  <rect class="success" x="1180" y="510" width="380" height="75" rx="15"/>
  <text class="ok" x="1370" y="544" text-anchor="middle">승인 일치 · 변경 성공</text>
  <text class="small" x="1370" y="570" text-anchor="middle">실행 원장과 ChangeEvent를 각각 연결</text>
</svg>
