<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata 인증과 권한 흐름</title>
  <desc id="desc">브라우저의 로그인 요청을 OpenMetadata Java 서버가 처리한다. 사내 인증 서비스와 인증 정보를 교환한 뒤 OpenMetadata JWT를 발급하고 REST API에서 권한을 판단한다.</desc>
  <defs>
    <style>
      .bg { fill:#F7F9FC; }
      .user { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; }
      .server { fill:#EAF8F1; stroke:#24845F; stroke-width:3; }
      .sso { fill:#FFF4E8; stroke:#E07A21; stroke-width:3; }
      .token { fill:#F4F0FF; stroke:#7A5AF8; stroke-width:3; }
      .api { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .line { stroke:#44546A; stroke-width:3; fill:none; }
      .arrowHead { fill:#44546A; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .flow { font:650 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#2F6FED; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="500" rx="26"/>
  <text class="title" x="55" y="58">OpenMetadata 인증과 권한 흐름</text>

  <rect class="user" x="55" y="180" width="240" height="130" rx="18"/>
  <text class="label" x="175" y="232" text-anchor="middle">사용자 · 브라우저</text>
  <text class="small" x="175" y="267" text-anchor="middle">로그인 시작</text>

  <path class="line" d="M295 245 H333"/>
  <polygon class="arrowHead" points="345,245 333,239 333,251"/>
  <text class="flow" x="320" y="217" text-anchor="middle">로그인 요청</text>

  <rect class="server" x="355" y="160" width="385" height="170" rx="18"/>
  <text class="label" x="547" y="218" text-anchor="middle">OpenMetadata Java 서버</text>
  <text class="small" x="547" y="255" text-anchor="middle">로그인 시작 · callback 검증</text>
  <text class="small" x="547" y="283" text-anchor="middle">Role · Policy 권한 판단</text>

  <path class="line" d="M740 245 H853"/>
  <polygon class="arrowHead" points="865,245 853,239 853,251"/>
  <text class="flow" x="802" y="217" text-anchor="middle">JWT 발급</text>

  <rect class="token" x="875" y="180" width="250" height="130" rx="18"/>
  <text class="label" x="1000" y="232" text-anchor="middle">OpenMetadata JWT</text>
  <text class="small" x="1000" y="267" text-anchor="middle">사용자 · Bot Token</text>

  <path class="line" d="M1125 245 H1243"/>
  <polygon class="arrowHead" points="1255,245 1243,239 1243,251"/>
  <text class="flow" x="1185" y="217" text-anchor="middle">Bearer Token</text>

  <rect class="api" x="1265" y="180" width="275" height="130" rx="18"/>
  <text class="label" x="1402" y="232" text-anchor="middle">REST API</text>
  <text class="small" x="1402" y="267" text-anchor="middle">JWT · Role · Policy</text>

  <path class="line" d="M485 330 V352"/>
  <polygon class="arrowHead" points="485,364 479,352 491,352"/>
  <text class="flow" x="425" y="354" text-anchor="middle">인증 요청</text>

  <path class="line" d="M635 365 V343"/>
  <polygon class="arrowHead" points="635,331 629,343 641,343"/>
  <text class="flow" x="695" y="354" text-anchor="middle">callback · assertion</text>

  <rect class="sso" x="405" y="365" width="310" height="100" rx="18"/>
  <text class="label" x="560" y="407" text-anchor="middle">사내 인증 서비스</text>
  <text class="small" x="560" y="438" text-anchor="middle">SSO · IdP</text>
</svg>
