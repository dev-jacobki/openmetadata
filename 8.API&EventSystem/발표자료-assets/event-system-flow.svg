<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata 이벤트의 생성, 관리, 사용 흐름</title>
  <desc id="desc">UI, Ingestion, SDK의 변경 요청이 성공하면 서버가 ChangeEvent를 DB에 저장하고 Event Subscription이 필터링하여 내부 알림, 메신저, 사내 Webhook 수신기로 전달하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2; rx:18; }
      .api { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; rx:18; }
      .event { fill:#FFF4E5; stroke:#D97706; stroke-width:3; rx:18; }
      .store { fill:#F2F0FF; stroke:#6941C6; stroke-width:3; rx:18; }
      .sub { fill:#EAF8F1; stroke:#24845F; stroke-width:3; rx:18; }
      .dest { fill:#FFFFFF; stroke:#7B8DA6; stroke-width:2.5; rx:16; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#44546A; stroke-width:3; fill:none; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .note { font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#B54708; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="680" rx="26"/>
  <text class="title" x="60" y="58">변경 요청에서 이벤트 소비까지</text>

  <rect class="box" x="45" y="125" width="220" height="205"/>
  <text class="label" x="155" y="170" text-anchor="middle">변경 주체</text>
  <text class="small" x="155" y="212" text-anchor="middle">UI 사용자</text>
  <text class="small" x="155" y="250" text-anchor="middle">Ingestion</text>
  <text class="small" x="155" y="288" text-anchor="middle">Java · curl · SDK</text>

  <path class="line" d="M265 228 H325"/>
  <rect class="api" x="330" y="145" width="220" height="165"/>
  <text class="label" x="440" y="202" text-anchor="middle">REST API</text>
  <text class="small" x="440" y="241" text-anchor="middle">POST · PUT</text>
  <text class="small" x="440" y="272" text-anchor="middle">PATCH · DELETE</text>

  <path class="line" d="M550 228 H610"/>
  <rect class="event" x="615" y="125" width="255" height="205"/>
  <text class="label" x="742" y="180" text-anchor="middle">ChangeEvent 생성</text>
  <text class="small" x="742" y="222" text-anchor="middle">응답 처리기</text>
  <text class="small" x="742" y="255" text-anchor="middle">일부 Repository</text>
  <text class="small" x="742" y="294" text-anchor="middle">사용자 · 버전 · 변경 내용</text>

  <path class="line" d="M870 228 H930"/>
  <rect class="store" x="935" y="145" width="220" height="165"/>
  <text class="label" x="1045" y="202" text-anchor="middle">change_event</text>
  <text class="small" x="1045" y="241" text-anchor="middle">순차 offset으로 저장</text>
  <text class="small" x="1045" y="272" text-anchor="middle">서버 DB에서 관리</text>

  <path class="line" d="M1155 228 H1215"/>
  <rect class="sub" x="1220" y="125" width="335" height="205"/>
  <text class="label" x="1387" y="178" text-anchor="middle">Event Subscription</text>
  <text class="small" x="1387" y="218" text-anchor="middle">offset 이후 이벤트 Polling</text>
  <text class="small" x="1387" y="252" text-anchor="middle">Resource · Filter · 수신자</text>
  <text class="small" x="1387" y="286" text-anchor="middle">성공 · 실패 · 상태 기록</text>

  <path class="branch" d="M1387 330 V382 H285"/>
  <path class="line" d="M285 382 V420"/>
  <path class="line" d="M800 382 V420"/>
  <path class="line" d="M1320 382 V420"/>

  <rect class="dest" x="105" y="425" width="360" height="115"/>
  <text class="label" x="285" y="470" text-anchor="middle">OpenMetadata 사용자</text>
  <text class="small" x="285" y="507" text-anchor="middle">Activity Feed · Email</text>

  <rect class="dest" x="620" y="425" width="360" height="115"/>
  <text class="label" x="800" y="470" text-anchor="middle">운영 · 데이터 팀</text>
  <text class="small" x="800" y="507" text-anchor="middle">Slack · Teams · Google Chat</text>

  <rect class="dest" x="1140" y="425" width="360" height="115"/>
  <text class="label" x="1320" y="470" text-anchor="middle">사내 애플리케이션</text>
  <text class="small" x="1320" y="507" text-anchor="middle">Generic Webhook 수신기</text>

  <rect x="330" y="585" width="940" height="58" rx="14" fill="#FFF4E5"/>
  <text class="note" x="800" y="621" text-anchor="middle">ChangeEvent는 변경을 승인하거나 막는 수단이 아니라, 성공한 변경의 사후 이벤트</text>
</svg>
