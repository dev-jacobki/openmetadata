<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata ChangeEvent 저장과 소비 흐름</title>
  <desc id="desc">외부 호출자가 Java REST API를 통해 변경하면 EventFilter와 Java ChangeEvent Writer가 OpenMetadata 메타데이터 DB의 change_event 테이블에 저장하고 Event Subscription이 읽어 목적지로 전달하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .client { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .server { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; }
      .handler { fill:#F4F0FF; stroke:#7A5AF8; stroke-width:3; }
      .db { fill:#FFF4E8; stroke:#E07A21; stroke-width:3; }
      .subscription { fill:#EAF8F1; stroke:#24845F; stroke-width:3; }
      .destination { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#44546A; stroke-width:2.5; fill:none; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 23px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .code { font:600 17px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; fill:#344054; }
      .note { font:650 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#B54708; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="780" rx="26"/>
  <text class="title" x="55" y="60">ChangeEvent를 실제로 저장하는 주체는 OpenMetadata Java 서버</text>

  <rect class="client" x="40" y="115" width="210" height="220" rx="18"/>
  <text class="label" x="145" y="168" text-anchor="middle">변경 호출자</text>
  <text class="small" x="145" y="215" text-anchor="middle">UI 사용자</text>
  <text class="small" x="145" y="250" text-anchor="middle">Python Ingestion</text>
  <text class="small" x="145" y="285" text-anchor="middle">Java SDK · curl</text>

  <path class="line" d="M250 225 H295"/>
  <rect class="server" x="300" y="115" width="250" height="220" rx="18"/>
  <text class="label" x="425" y="168" text-anchor="middle">Java Backend</text>
  <text class="small" x="425" y="215" text-anchor="middle">Resource</text>
  <text class="small" x="425" y="250" text-anchor="middle">Repository</text>
  <text class="small" x="425" y="285" text-anchor="middle">C / U / D 완료</text>

  <path class="line" d="M550 225 H595"/>
  <rect class="server" x="600" y="115" width="240" height="220" rx="18"/>
  <text class="label" x="720" y="168" text-anchor="middle">EventFilter</text>
  <text class="small" x="720" y="210" text-anchor="middle">POST · PUT</text>
  <text class="small" x="720" y="245" text-anchor="middle">PATCH · DELETE</text>
  <text class="small" x="720" y="280" text-anchor="middle">2xx만 비동기 예약</text>

  <path class="line" d="M840 225 H885"/>
  <rect class="handler" x="890" y="115" width="310" height="220" rx="18"/>
  <text class="label" x="1045" y="165" text-anchor="middle">Java Event Writer</text>
  <text class="small" x="1045" y="207" text-anchor="middle">ChangeEventHandler</text>
  <text class="small" x="1045" y="242" text-anchor="middle">일부 Repository</text>
  <text class="code" x="1045" y="282" text-anchor="middle">ChangeEventDAO.insert</text>

  <path class="line" d="M1200 225 H1245"/>
  <rect class="db" x="1250" y="115" width="310" height="220" rx="18"/>
  <text class="label" x="1405" y="165" text-anchor="middle">Metadata DB</text>
  <text class="small" x="1405" y="207" text-anchor="middle">database.url이 가리키는</text>
  <text class="small" x="1405" y="242" text-anchor="middle">MySQL · PostgreSQL</text>
  <text class="code" x="1405" y="282" text-anchor="middle">change_event</text>
  <text class="small" x="1405" y="312" text-anchor="middle">JSON(B) · offset</text>

  <path class="line" d="M1405 335 V385 H800 V415"/>
  <rect class="subscription" x="590" y="420" width="420" height="120" rx="18"/>
  <text class="label" x="800" y="468" text-anchor="middle">Event Subscription Scheduler</text>
  <text class="small" x="800" y="506" text-anchor="middle">구독별 offset 이후 Event 조회 · 필터 · 전달</text>

  <path class="branch" d="M800 540 V575 H260"/>
  <path class="branch" d="M800 575 H1340"/>
  <path class="line" d="M260 575 V610"/>
  <path class="line" d="M800 575 V610"/>
  <path class="line" d="M1340 575 V610"/>

  <rect class="destination" x="80" y="615" width="360" height="95" rx="16"/>
  <text class="label" x="260" y="655" text-anchor="middle">OpenMetadata 사용자</text>
  <text class="small" x="260" y="687" text-anchor="middle">Activity Feed · Email</text>

  <rect class="destination" x="620" y="615" width="360" height="95" rx="16"/>
  <text class="label" x="800" y="655" text-anchor="middle">운영 · 데이터 팀</text>
  <text class="small" x="800" y="687" text-anchor="middle">Slack · Teams · Google Chat</text>

  <rect class="destination" x="1160" y="615" width="360" height="95" rx="16"/>
  <text class="label" x="1340" y="655" text-anchor="middle">사내 애플리케이션</text>
  <text class="small" x="1340" y="687" text-anchor="middle">Generic Webhook</text>

  <text class="note" x="800" y="752" text-anchor="middle">API 변경 성공, change_event 저장, 목적지 전달은 각각 별도 상태로 관측한다.</text>
</svg>
