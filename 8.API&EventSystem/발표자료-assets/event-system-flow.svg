<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata ChangeEvent 저장과 구독 전달 흐름</title>
  <desc id="desc">성공한 변경 요청이 OpenMetadata Java 서버를 거쳐 change_event 테이블에 저장된다. EventSubscriptionScheduler가 Subscription의 current offset을 읽고 change_event에서 더 큰 offset의 Event를 조회해 조건에 맞는 목적지로 전달한다.</desc>
  <defs>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .server { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; }
      .db { fill:#FFF4E8; stroke:#E07A21; stroke-width:3; }
      .scheduler { fill:#EAF8F1; stroke:#24845F; stroke-width:3; }
      .filter { fill:#F4F0FF; stroke:#7A5AF8; stroke-width:3; }
      .destination { fill:#EEF7FA; stroke:#167C80; stroke-width:3; }
      .line { stroke:#44546A; stroke-width:3; fill:none; }
      .arrowHead { fill:#44546A; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .flow { font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#2F6FED; }
      .label { font:700 22px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .note { font:600 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#667085; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="680" rx="26"/>
  <text class="title" x="55" y="58">Event System: ChangeEvent 저장과 구독 전달은 두 흐름으로 동작</text>

  <text class="flow" x="55" y="108">1. 변경 저장 흐름</text>
  <rect class="box" x="55" y="135" width="260" height="135" rx="18"/>
  <text class="label" x="185" y="185" text-anchor="middle">변경 요청</text>
  <text class="small" x="185" y="223" text-anchor="middle">UI · Ingestion · SDK</text>
  <text class="small" x="185" y="248" text-anchor="middle">POST · PUT · PATCH · DELETE</text>

  <path class="line" d="M315 202 H366"/>
  <polygon class="arrowHead" points="378,202 366,196 366,208"/>
  <rect class="server" x="385" y="120" width="405" height="165" rx="18"/>
  <text class="label" x="587" y="173" text-anchor="middle">OpenMetadata Java 서버</text>
  <text class="small" x="587" y="213" text-anchor="middle">엔티티 C / U / D 반영</text>
  <text class="small" x="587" y="243" text-anchor="middle">성공 응답 뒤 ChangeEvent 비동기 생성</text>

  <path class="line" d="M790 202 H841"/>
  <polygon class="arrowHead" points="853,202 841,196 841,208"/>
  <rect class="db" x="860" y="135" width="335" height="135" rx="18"/>
  <text class="label" x="1027" y="185" text-anchor="middle">OpenMetadata DB</text>
  <text class="small" x="1027" y="223" text-anchor="middle">change_event 테이블</text>
  <text class="small" x="1027" y="248" text-anchor="middle">이벤트 JSON · offset 저장</text>

  <text class="flow" x="55" y="375">2. 구독 전달 흐름</text>
  <rect class="scheduler" x="55" y="405" width="315" height="145" rx="18"/>
  <text class="label" x="212" y="450" text-anchor="middle">Java Scheduler</text>
  <text class="small" x="212" y="485" text-anchor="middle">EventSubscriptionScheduler</text>
  <text class="small" x="212" y="514" text-anchor="middle">Subscription별 pollInterval 실행</text>
  <text class="small" x="212" y="537" text-anchor="middle">current offset 로드</text>

  <path class="line" d="M370 477 H416"/>
  <polygon class="arrowHead" points="428,477 416,471 416,483"/>
  <rect class="db" x="435" y="405" width="350" height="145" rx="18"/>
  <text class="label" x="610" y="450" text-anchor="middle">OpenMetadata DB</text>
  <text class="small" x="610" y="485" text-anchor="middle">change_event 테이블 조회</text>
  <text class="small" x="610" y="514" text-anchor="middle">WHERE offset &gt; current offset</text>
  <text class="small" x="610" y="537" text-anchor="middle">ChangeEvent JSON 반환</text>

  <path class="line" d="M785 477 H831"/>
  <polygon class="arrowHead" points="843,477 831,471 831,483"/>
  <rect class="filter" x="850" y="405" width="300" height="145" rx="18"/>
  <text class="label" x="1000" y="450" text-anchor="middle">구독 조건 평가</text>
  <text class="small" x="1000" y="485" text-anchor="middle">Filter: 어떤 Event인가</text>
  <text class="small" x="1000" y="514" text-anchor="middle">Recipient: 누가 받는가</text>
  <text class="small" x="1000" y="537" text-anchor="middle">Destination: 어디로 보낼까</text>

  <path class="line" d="M1150 477 H1178"/>
  <polygon class="arrowHead" points="1190,477 1178,471 1178,483"/>
  <rect class="destination" x="1200" y="390" width="340" height="175" rx="18"/>
  <text class="label" x="1370" y="442" text-anchor="middle">전달 대상 (Destination)</text>
  <text class="small" x="1370" y="480" text-anchor="middle">Activity Feed · Email · Slack</text>
  <text class="small" x="1370" y="510" text-anchor="middle">Teams · Generic Webhook</text>

  <text class="note" x="800" y="640" text-anchor="middle">변경 API 성공, ChangeEvent 저장, 목적지 전달은 각각 별도의 성공·실패 상태를 가진다.</text>
</svg>
