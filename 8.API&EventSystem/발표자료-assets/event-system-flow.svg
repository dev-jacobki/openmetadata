<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" role="img" aria-labelledby="title desc">
  <title id="title">OpenMetadata ChangeEvent 저장과 전달 흐름</title>
  <desc id="desc">변경 요청을 받은 OpenMetadata Java 서버가 메타데이터와 ChangeEvent를 저장한다. Java Scheduler가 주기적으로 데이터베이스를 조회해 구독 조건에 맞는 이벤트를 목적지에 전달한다.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2.5; }
      .server { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; }
      .db { fill:#FFF4E8; stroke:#E07A21; stroke-width:3; }
      .scheduler { fill:#EAF8F1; stroke:#24845F; stroke-width:3; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#44546A; stroke-width:2.5; fill:none; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 24px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .step { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#2F6FED; }
      .note { font:700 19px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#B54708; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="650" rx="26"/>
  <text class="title" x="55" y="60">ChangeEvent: Java 서버가 저장하고 Scheduler가 구독을 전달</text>

  <rect class="box" x="45" y="130" width="250" height="150" rx="18"/>
  <text class="label" x="170" y="178" text-anchor="middle">변경 요청</text>
  <text class="small" x="170" y="218" text-anchor="middle">UI · Ingestion</text>
  <text class="small" x="170" y="248" text-anchor="middle">Java SDK · curl</text>

  <path class="line" d="M295 205 H355"/>
  <text class="step" x="325" y="112" text-anchor="middle">1. API 요청</text>

  <rect class="server" x="360" y="110" width="400" height="190" rx="18"/>
  <text class="label" x="560" y="162" text-anchor="middle">OpenMetadata Java 서버</text>
  <text class="small" x="560" y="210" text-anchor="middle">요청 검증 후 메타데이터 C / U / D 반영</text>
  <text class="small" x="560" y="245" text-anchor="middle">성공한 변경의 ChangeEvent를 비동기 저장</text>

  <path class="line" d="M760 205 H830"/>
  <text class="step" x="795" y="112" text-anchor="middle">2. ChangeEvent 저장</text>

  <rect class="db" x="835" y="130" width="315" height="150" rx="18"/>
  <text class="label" x="992" y="178" text-anchor="middle">OpenMetadata DB</text>
  <text class="small" x="992" y="218" text-anchor="middle">change_event: 이벤트 JSON</text>
  <text class="small" x="992" y="248" text-anchor="middle">Subscription 설정·읽기 offset</text>

  <path class="line" d="M992 280 V355"/>
  <text class="step" x="1025" y="330">3. Java Scheduler가 조회</text>

  <rect class="scheduler" x="640" y="365" width="705" height="105" rx="18"/>
  <text class="label" x="992" y="407" text-anchor="middle">OpenMetadata Java Scheduler</text>
  <text class="small" x="992" y="444" text-anchor="middle">구독별 pollInterval마다 offset 이후 조회 · 조건·수신자 평가 · 목적지 전송</text>

  <path class="branch" d="M992 470 V520 H270"/>
  <path class="branch" d="M992 520 H1330"/>
  <path class="line" d="M270 520 V550"/>
  <path class="line" d="M800 520 V550"/>
  <path class="line" d="M1330 520 V550"/>

  <rect class="box" x="85" y="555" width="370" height="65" rx="16"/>
  <text class="small" x="270" y="596" text-anchor="middle">Activity Feed · Email</text>
  <rect class="box" x="615" y="555" width="370" height="65" rx="16"/>
  <text class="small" x="800" y="596" text-anchor="middle">Slack · Teams · Google Chat</text>
  <rect class="box" x="1145" y="555" width="370" height="65" rx="16"/>
  <text class="small" x="1330" y="596" text-anchor="middle">Generic Webhook</text>

  <text class="note" x="800" y="642" text-anchor="middle">API 변경, ChangeEvent 저장, 목적지 전달은 서로 다른 상태로 관측한다.</text>
</svg>
