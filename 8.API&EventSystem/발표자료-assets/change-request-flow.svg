<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="540" viewBox="0 0 1600 540" role="img" aria-labelledby="title desc">
  <title id="title">Change Request 연계에서 API와 Event System이 확인할 지점</title>
  <desc id="desc">변경 후보와 승인 결과가 실행 전 일치 확인을 거쳐 OpenMetadata API로 실행되고, ChangeEvent와 실행 기록이 별도로 남는 구조</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2; rx:18; }
      .candidate { fill:#F2F0FF; stroke:#6941C6; stroke-width:3; rx:18; }
      .approval { fill:#FFF4E5; stroke:#D97706; stroke-width:3; rx:18; }
      .check { fill:#EAF8F1; stroke:#24845F; stroke-width:3; rx:18; }
      .api { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; rx:18; }
      .event { fill:#EEF7FA; stroke:#167C80; stroke-width:3; rx:18; }
      .record { fill:#F2F0FF; stroke:#6941C6; stroke-width:3; rx:18; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#44546A; stroke-width:3; fill:none; }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 20px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 16px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .note { font:600 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#667085; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="540" rx="26"/>
  <text class="title" x="60" y="58">Change Request 연계에서 API·Event System이 확인할 지점</text>

  <rect class="candidate" x="45" y="145" width="225" height="125"/>
  <text class="label" x="157" y="192" text-anchor="middle">변경 후보</text>
  <text class="small" x="157" y="224" text-anchor="middle">Ingestion · Java</text>
  <text class="small" x="157" y="248" text-anchor="middle">C / U / D</text>

  <path class="line" d="M270 207 H325"/>
  <rect class="approval" x="330" y="145" width="250" height="125"/>
  <text class="label" x="455" y="192" text-anchor="middle">승인 결과</text>
  <text class="small" x="455" y="224" text-anchor="middle">승인 · 반려 · 취소 상태</text>
  <text class="small" x="455" y="248" text-anchor="middle">승인된 작업·대상</text>

  <path class="line" d="M580 207 H635"/>
  <rect class="check" x="640" y="135" width="295" height="145"/>
  <text class="label" x="787" y="181" text-anchor="middle">실행 전 일치 확인</text>
  <text class="small" x="787" y="213" text-anchor="middle">대상 · 본문 Hash · ETag</text>
  <text class="small" x="787" y="237" text-anchor="middle">삭제 옵션 · 실행 식별자</text>
  <text class="small" x="787" y="261" text-anchor="middle">반려·취소면 API 호출 없음</text>

  <path class="line" d="M935 207 H990"/>
  <rect class="api" x="995" y="145" width="245" height="125"/>
  <text class="label" x="1117" y="192" text-anchor="middle">OpenMetadata API</text>
  <text class="small" x="1117" y="224" text-anchor="middle">POST · PATCH · DELETE</text>
  <text class="small" x="1117" y="248" text-anchor="middle">연계용 Bot 실행</text>

  <path class="line" d="M1240 207 H1295"/>
  <rect class="event" x="1300" y="145" width="255" height="125"/>
  <text class="label" x="1427" y="192" text-anchor="middle">ChangeEvent</text>
  <text class="small" x="1427" y="224" text-anchor="middle">DB 저장 후 구독·전달</text>
  <text class="small" x="1427" y="248" text-anchor="middle">사후 관측 정보</text>

  <path class="branch" d="M1117 270 V330"/>
  <path class="line" d="M1117 330 H785 V375"/>
  <path class="branch" d="M1427 270 V330"/>
  <path class="line" d="M1427 330 H1310 V375"/>

  <rect class="record" x="565" y="380" width="440" height="100"/>
  <text class="label" x="785" y="420" text-anchor="middle">API 실행 기록</text>
  <text class="small" x="785" y="452" text-anchor="middle">실행 ID · HTTP 상태 · 엔티티 Version · 실행 Bot</text>

  <rect class="box" x="1090" y="380" width="390" height="100"/>
  <text class="label" x="1285" y="420" text-anchor="middle">구독·수신 결과</text>
  <text class="small" x="1285" y="452" text-anchor="middle">Webhook 전달 성공·실패는 API 결과와 별도</text>

  <text class="note" x="800" y="515" text-anchor="middle">결재 절차를 설계하는 그림이 아니라, 실행 시 API·Event System이 연결되는 지점을 나타낸다.</text>
</svg>
