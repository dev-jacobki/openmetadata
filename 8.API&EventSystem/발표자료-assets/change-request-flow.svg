<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
  <title id="title">사내 인증 서비스의 Change Request와 OpenMetadata 변경 연계 흐름</title>
  <desc id="desc">Ingestion과 Java의 변경 후보를 실행 명세로 고정해 사내 인증 서비스에 Change Request를 요청하고 승인된 경우만 공통 Write Gateway를 거쳐 OpenMetadata CUD를 실행한 뒤 실행 원장과 ChangeEvent를 별도로 연결하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#44546A"/>
    </marker>
    <marker id="redArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#D92D20"/>
    </marker>
    <style>
      .bg { fill:#F7F9FC; }
      .box { fill:#FFFFFF; stroke:#A9B7C9; stroke-width:2; rx:18; }
      .manifest { fill:#FFF4E5; stroke:#D97706; stroke-width:3; rx:18; }
      .approved { fill:#EAF8F1; stroke:#24845F; stroke-width:3; rx:18; }
      .mutate { fill:#EAF2FF; stroke:#2F6FED; stroke-width:3; rx:18; }
      .record { fill:#F2F0FF; stroke:#6941C6; stroke-width:3; rx:18; }
      .stop { fill:#FFF0F0; stroke:#D92D20; stroke-width:2.5; rx:18; }
      .line { stroke:#44546A; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .branch { stroke:#44546A; stroke-width:3; fill:none; }
      .rejectLine { stroke:#D92D20; stroke-width:3; fill:none; marker-end:url(#redArrow); }
      .title { font:700 30px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .label { font:700 21px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#172033; }
      .small { font:500 17px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#475467; }
      .ok { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#18704E; }
      .bad { font:700 18px -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif; fill:#B42318; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="620" rx="26"/>
  <text class="title" x="60" y="58">승인 결과와 실제 OpenMetadata 변경을 연결하는 구조</text>

  <rect class="box" x="45" y="145" width="210" height="150"/>
  <text class="label" x="150" y="197" text-anchor="middle">변경 후보</text>
  <text class="small" x="150" y="235" text-anchor="middle">Ingestion · Java</text>
  <text class="small" x="150" y="266" text-anchor="middle">C / U / D</text>

  <path class="line" d="M255 220 H315"/>
  <rect class="manifest" x="320" y="135" width="245" height="170"/>
  <text class="label" x="442" y="187" text-anchor="middle">실행 명세 고정</text>
  <text class="small" x="442" y="225" text-anchor="middle">대상 · 작업 · Payload Hash</text>
  <text class="small" x="442" y="257" text-anchor="middle">Version · ETag · Execution ID</text>

  <path class="line" d="M565 220 H625"/>
  <polygon points="730,125 835,220 730,315 625,220" fill="#FFFFFF" stroke="#7B8DA6" stroke-width="3"/>
  <text class="label" x="730" y="188" text-anchor="middle">사내 인증 서비스</text>
  <text class="label" x="730" y="222" text-anchor="middle">Change Request</text>
  <text class="small" x="730" y="258" text-anchor="middle">승인 결과</text>

  <text class="ok" x="882" y="193" text-anchor="middle">승인</text>
  <path class="line" d="M835 220 H915"/>
  <rect class="approved" x="920" y="135" width="255" height="170"/>
  <text class="label" x="1047" y="187" text-anchor="middle">Write Gateway</text>
  <text class="small" x="1047" y="225" text-anchor="middle">승인 상태 · Hash</text>
  <text class="small" x="1047" y="257" text-anchor="middle">현재 Version 재검증</text>

  <path class="line" d="M1175 220 H1235"/>
  <rect class="mutate" x="1240" y="135" width="285" height="170"/>
  <text class="label" x="1382" y="187" text-anchor="middle">OpenMetadata API</text>
  <text class="small" x="1382" y="225" text-anchor="middle">POST · PATCH · DELETE</text>
  <text class="small" x="1382" y="257" text-anchor="middle">전용 Bot으로 실행</text>

  <text class="bad" x="730" y="370" text-anchor="middle">반려 · 취소</text>
  <path class="rejectLine" d="M730 315 V420 H515"/>
  <rect class="stop" x="190" y="375" width="320" height="100"/>
  <text class="label" x="350" y="417" text-anchor="middle">OpenMetadata 호출 없음</text>
  <text class="small" x="350" y="449" text-anchor="middle">NOT_EXECUTED 기록</text>

  <path class="branch" d="M1382 305 V355"/>
  <path class="line" d="M1382 355 H1115 V400"/>
  <path class="line" d="M1382 355 H1450 V400"/>

  <rect class="record" x="945" y="405" width="340" height="125"/>
  <text class="label" x="1115" y="451" text-anchor="middle">실행 원장</text>
  <text class="small" x="1115" y="487" text-anchor="middle">HTTP 결과 · Version · 사람 · Bot</text>

  <rect class="box" x="1310" y="405" width="240" height="125"/>
  <text class="label" x="1430" y="451" text-anchor="middle">ChangeEvent</text>
  <text class="small" x="1430" y="487" text-anchor="middle">비동기 사후 연결</text>

  <text class="small" x="800" y="582" text-anchor="middle">승인 상태, API 실행 결과, Event 전달 결과는 각각 독립적으로 기록한다.</text>
</svg>
